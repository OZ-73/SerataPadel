function teamKeyIds(ids){ return [...ids].sort().join('|'); }

// Statistiche per coppia ricavate dalle singole partite (servono quando una squadra ha avuto sostituzioni).
function pairStatsFromMatches(matches, teamIdx){
  const res = {};
  matches.forEach(m => {
    [['a', m.aId, m.pa, m.s1, m.s2], ['b', m.bId, m.pb, m.s2, m.s1]].forEach(([side, tid, ids, g, go]) => {
      if(tid !== teamIdx || !ids || ids.length < 2) return;
      const key = teamKeyIds(ids);
      if(!res[key]) res[key] = { ids, matches:0, wins:0, setsWon:0, setsLost:0 };
      const r = res[key];
      r.matches++; r.setsWon += g; r.setsLost += go;
      const w = matchWinner(m.s1, m.s2, m.tb);
      if((side === 'a' && w === 1) || (side === 'b' && w === 0)) r.wins++;
    });
  });
  return Object.values(res);
}
function teamStats(list, includeLive, withRot){
  list = list || archive;
  if(includeLive === undefined) includeLive = true;
  const map = {};
  const byId = roster;  // la chiave della rubrica È l'id
  function addToMap(name, players, ids, wins, setsWon, setsLost, matches){
    if(!ids || ids.length===0) return;
    const key = teamKeyIds(ids);
    // Nomi attuali dei giocatori (se sono stati rinominati), altrimenti quelli registrati.
    const cur = ids.map((id,i) => byId[id] ? byId[id].name : ((players && players[i]) || id));
    if(!map[key]) map[key] = { key, name, players:cur, ids, matches:0, wins:0, setsWon:0, setsLost:0 };
    map[key].name = cur.join(' & ');
    map[key].players = cur;
    map[key].matches += matches;
    map[key].wins += wins;
    map[key].setsWon += setsWon;
    map[key].setsLost += setsLost;
  }
  list.forEach(a => {
    if(!countsForRatings(a)) return;            // torneo escluso o prima della data di inizio
    if(a.mode && a.mode !== 'fixed'){
      // Americano/Messicano non hanno squadre fisse: le coppie entrano solo se richiesto (spunta nella classifica squadre)
      if(!withRot) return;
      (a.history||[]).forEach(h => (h.matches||[]).forEach(m => {
        const b = matchBaseIds(a, m), r = matchWinner(m.s1, m.s2, m.tb);
        [[b.a, m.s1, m.s2, r === 1], [b.b, m.s2, m.s1, r === 0]].forEach(([ids, gw, gl, won]) => { if(ids && ids.length === 2) addToMap(null, null, ids, won ? 1 : 0, gw, gl, 1); });
      }));
      return;
    }
    (a.teams||[]).forEach((tm, ti) => {
      if(tm.subs && tm.subs.length){
        const all = []; (a.history||[]).forEach(h => h.matches.forEach(m => all.push(m)));
        pairStatsFromMatches(all, ti).forEach(r => addToMap(null, null, r.ids, r.wins, r.setsWon, r.setsLost, r.matches));
        return;
      }
      let matches = 0;
      (a.history||[]).forEach(h => h.matches.forEach(m => { if(m.a===tm.name || m.b===tm.name) matches++; }));
      const plist = tm.players || tm.name.split(' & ');
      addToMap(tm.name, plist, tm.playerIds || plist.map(resolveId), tm.wins, tm.setsWon, tm.setsLost, matches);
    });
  });
  if(includeLive && !t.unofficial && t.teams && t.teams.length){
    t.teams.forEach(tm => {
      if(tm.subs && tm.subs.length){
        const all = []; (t.history||[]).forEach(h => h.matches.forEach(m => all.push(m)));
        pairStatsFromMatches(all, tm.id).forEach(r => addToMap(null, null, r.ids, r.wins, r.setsWon, r.setsLost, r.matches));
        return;
      }
      addToMap(tm.name, tm.players, tm.players.map(resolveId), tm.wins, tm.setsWon, tm.setsLost, tm.matchesPlayed||0);
    });
  }
  return Object.values(map);
}

function computeRanks(list, keyFn){
  const keys = list.map(keyFn);
  const out = [];
  let lastKey = null, lastRank = 0;
  keys.forEach((key,i) => {
    const rank = (i>0 && key===lastKey) ? lastRank : i+1;
    out.push(rank);
    lastKey = key; lastRank = rank;
  });
  return out.map((rank,i) => ({ rank, tied: (i>0 && keys[i-1]===keys[i]) || (i<keys.length-1 && keys[i+1]===keys[i]) }));
}

function archivePlayerStandings(a){
  const byId = roster;  // la chiave della rubrica È l'id
  const st = {};
  (a.players || []).forEach(id => { st[id] = { id, matches:0, wins:0, gW:0, gL:0 }; });
  (a.history || []).forEach(h => h.matches.forEach(m => {
    const win = matchWinner(m.s1, m.s2, m.tb);
    (m.pa || []).forEach(id => { if(!st[id]) st[id] = { id, matches:0, wins:0, gW:0, gL:0 }; st[id].matches++; st[id].gW += m.s1; st[id].gL += m.s2; if(win===1) st[id].wins++; });
    (m.pb || []).forEach(id => { if(!st[id]) st[id] = { id, matches:0, wins:0, gW:0, gL:0 }; st[id].matches++; st[id].gW += m.s2; st[id].gL += m.s1; if(win===0) st[id].wins++; });
  }));
  return Object.values(st).map(r => ({ ...r, name: byId[r.id] ? byId[r.id].name : r.id }))
    .sort((x,y)=> y.wins-x.wins || (y.gW-y.gL)-(x.gW-x.gL) || y.gW-x.gW || x.name.localeCompare(y.name));
}

function recomputeTeamAggregates(a){
  a.teams.forEach(tm => { tm.wins = 0; tm.setsWon = 0; tm.setsLost = 0; });
  (a.history || []).forEach(h => h.matches.forEach(m => {
    const A = a.teams[m.aId], B = a.teams[m.bId];
    const win = matchWinner(m.s1, m.s2, m.tb);
    if(A){ A.setsWon += m.s1; A.setsLost += m.s2; if(win===1) A.wins++; }
    if(B){ B.setsWon += m.s2; B.setsLost += m.s1; if(win===0) B.wins++; }
  }));
}
function saveArchiveEdit(i){

  };

      if(!tbr.ok){ err.textContent = 'Turno '+a.history[hi].round+': sul 6-6 serve il punteggio del tie-break (7 con almeno 2 di scarto).'; return; }
      const chkA = document.getElementById('ea_'+hi+'_'+mi+'_swA'), chkB = document.getElementById('ea_'+hi+'_'+mi+'_swB');
      const rdSel = document.getElementById('ea_'+hi+'_'+mi+'_rd');
      if(rdSel && rdSel.value !== String(a.history[hi].round)) moves.push({ hi, mi, to: rdSel.value });
      updates.push(() => {
        const mm = a.history[hi].matches[mi];
        mm.s1 = sc[0]; mm.s2 = sc[1]; mm.tb = tbr.tb;
        if(chkA && chkB){
          const f = matchSwapFlags(a, mm);

          if(f.usable && (f.rec || chkA.checked || chkB.checked)){

    if(conflict){ err.textContent = 'Turno '+conflict.round+': '+conflict.who+' giocherebbe due volte. Scegli un altro turno.'; return; }

  if(moves.length) archiveApplyMoves(a, moves);
  if(!a.mode || a.mode === 'fixed'){ recomputeTeamAggregates(a); }
  recomputeRatings();
  ratingSummary = null;
  saveArchive(); saveRoster();
  editingArchiveIdx = null;

// Sposta una partita extra archiviata in un turno ufficiale: da quel momento conta nella classifica V/game del torneo (solo Americano/Messicano).
// A quale coppia di squadre del torneo corrisponde una partita extra (solo squadre fisse). Una squadra "è" la sua composizione
// finale, ma anche ogni coppia con cui ha giocato prima di eventuali sostituzioni.
function extraTeamIds(a, x){
  if(a.mode && a.mode !== 'fixed') return null;
  const same = (p, q) => p && q && p.length === q.length && p.every(id => q.includes(id));
  const pairsOf = idx => {
    const tm = a.teams[idx] || {};
    const list = [tm.playerIds];
    (a.history || []).forEach(h => h.matches.forEach(m => { if(m.aId === idx) list.push(m.pa); if(m.bId === idx) list.push(m.pb); }));
    // composizioni precedenti alle sostituzioni (si ricostruiscono andando a ritroso)
    let cur = (tm.playerIds || []).slice();
    (tm.subs || []).slice().reverse().forEach(sb => {
      const inId = findIdByName(sb.in), outId = findIdByName(sb.out);
      if(inId && outId){ cur = cur.map(id => id === inId ? outId : id); list.push(cur.slice()); }
    });
    return list;
  };
  const find = ids => (a.teams || []).findIndex((tm, idx) => pairsOf(idx).some(pr => same(pr, ids)));
  const ia = find(x.idsA), ib = find(x.idsB);
  return (ia >= 0 && ib >= 0 && ia !== ib) ? { aId: ia, bId: ib } : null;
}
function canMoveExtraToRound(a, x){ return (a.mode && a.mode !== 'fixed') || !!extraTeamIds(a, x); }
function moveArchiveExtraToRound(i, id){
  const a = archive[i];
  const x = (a.extras||[]).find(e => e.id === id);
  if(!x) return;
  const fixed = !a.mode || a.mode === 'fixed';
  let ids = null;
  if(fixed){
    ids = extraTeamIds(a, x);
    if(!ids){ dataMsg = 'Questa partita non corrisponde a due squadre del torneo: resta tra le extra.'; render(); return; }
  }
  a.extras = a.extras.filter(e => e.id !== id);
  const rec = fixed
    ? { aId: ids.aId, bId: ids.bId, a: x.teamA.join(' & '), b: x.teamB.join(' & '), pa: x.idsA||[], pb: x.idsB||[], s1: x.s1, s2: x.s2, tb: x.tb, court: 0 }
    : { pa: x.idsA||[], pb: x.idsB||[], a: x.teamA.join(' & '), b: x.teamB.join(' & '), s1: x.s1, s2: x.s2, tb: x.tb, court: 0 };
  if(x.sides) rec.sides = x.sides;
  if(typeof x.pA === 'number') rec.pA = x.pA;
  if(!a.history) a.history = [];
  // se si sa da quale turno veniva e il turno esiste ancora, torna lì; altrimenti diventa un nuovo turno in coda
  let h = x.fromRound ? a.history.find(r => r.round === x.fromRound) : null;
  if(h){ rec.court = h.matches.length; h.matches.push(rec); }
  else {
    const next = a.history.reduce((mx, r) => Math.max(mx, r.round || 0), 0) + 1;
    a.history.push({ round: next, resting: [], matches: [rec] });
  }
  a.roundsPlayed = a.history.length;
  if(fixed) recomputeTeamAggregates(a);
  recomputeRatings();
  ratingSummary = null;
  saveArchive(); saveRoster();
  render();
}

function setArchiveRoundField(field, val){
  const d = archiveRoundDraft, oldVal = d[field];
  if(val !== ''){
    ['a1','a2','b1','b2'].forEach(f => { if(f !== field && d[f] === val){ d[f] = oldVal; } });
  }
  d[field] = val;
  render();
}
function archiveRoundSelect(field, players){
  const d = archiveRoundDraft;
  const taken = ['a1','a2','b1','b2'].filter(f => f!==field).map(f => d[f]).filter(Boolean);
  let html = '<select onchange="setArchiveRoundField('+jsArg(field)+',this.value)"><option value="">—</option>';
  players.forEach(n => { html += '<option value="'+esc(n)+'"'+(d[field]===n?' selected':'')+'>'+esc(n)+(taken.includes(n)?' (occupato)':'')+'</option>'; });
  return html + '</select>';
}
function saveArchiveRound(){
  const d = archiveRoundDraft;
  const a = archive[d.idx];
  const err = document.getElementById('archiveRoundErr');
  const names = [d.a1, d.a2, d.b1, d.b2];
  if(names.some(n => !n)){ err.textContent = 'Scegli tutti e quattro i giocatori.'; return; }
  if(new Set(names).size !== 4){ err.textContent = 'Ogni giocatore può comparire una sola volta.'; return; }
  const s1 = Number(d.s1), s2 = Number(d.s2);
  const isInt = Number.isInteger(s1) && Number.isInteger(s2) && s1>=0 && s2>=0;
  if(d.s1==='' || d.s2==='' || !isInt || s1+s2===0){
    err.textContent = 'Inserisci un punteggio con numeri interi (va bene anche una partita interrotta).'; return;
  }
  if(!scoreIsPlausible(s1, s2)){
    err.textContent = 'Sopra il 6 lo scarto può essere al massimo di 2 game: la partita sarebbe già finita.'; return;
  }
  let tb;
  if(isTiedSix(s1, s2)){
    const tb1 = Number(d.tb1), tb2 = Number(d.tb2);
    if(d.tb1==='' || d.tb2==='' || !tiebreakIsPlausible(tb1, tb2)){
      err.textContent = 'Sul 6-6 inserisci il punteggio del tie-break (chi arriva a 7 con almeno 2 di scarto).'; return;
    }
    tb = [tb1, tb2];
  }
  const pa = [d.a1, d.a2].map(resolveId), pb = [d.b1, d.b2].map(resolveId);
  a.roundsPlayed = (a.roundsPlayed||0) + 1;
  if(!a.history) a.history = [];
  a.history.push({ round: a.roundsPlayed, resting: [], matches: [{ pa, pb, a: d.a1+' & '+d.a2, b: d.b1+' & '+d.b2, s1, s2, tb, court: 0 }] });
  archiveRoundDraft = null;
  recomputeRatings();
  ratingSummary = null;
  saveArchive(); saveRoster();
  render();
}

// Elimina una partita da un turno ufficiale già archiviato (e il turno stesso se resta vuoto).
function removeArchiveRoundMatch(i, hi, mi){
  const a = archive[i];
  const h = a.history[hi];
  if(!h) return;
  h.matches.splice(mi, 1);
  if(h.matches.length === 0) a.history.splice(hi, 1);
  a.roundsPlayed = a.history.length;
  if(!a.mode || a.mode === 'fixed'){ recomputeTeamAggregates(a); }
  recomputeRatings();
  ratingSummary = null;
  saveArchive(); saveRoster();
  render();
}
function askRemoveArchiveRoundMatch(i, hi, mi){
  const a = archive[i];
  const m = a.history[hi] && a.history[hi].matches[mi];
  if(!m) return;
  archiveRemoveConfirm = { type:'round', i, hi, mi, desc: m.a+' vs '+m.b+' ('+m.s1+'-'+m.s2+')' };
  render();
}
// Sposta una partita da un turno ufficiale già archiviato alle partite extra (non conta più per la classifica del torneo, ma resta nel rating con peso pieno).
function moveArchiveMatchToExtra(i, hi, mi){
  const a = archive[i];
  const h = a.history[hi];
  if(!h) return;
  const m = h.matches[mi];
  const nm = archiveIdNames(a);
  const nameOf = id => nm[id] || (roster[id] && roster[id].name) || id;
  const teamA = (m.pa||[]).map(nameOf), teamB = (m.pb||[]).map(nameOf);
  if(!a.extras) a.extras = [];
  const ex = { id: Date.now(), teamA, teamB, s1:m.s1, s2:m.s2, tb:m.tb, rating:'full', weight:1, idsA:m.pa||[], idsB:m.pb||[], fromRound:h.round };
  if(m.sides) ex.sides = m.sides;          // si ripristinano se la partita torna tra i turni
  if(typeof m.pA === 'number') ex.pA = m.pA;
  a.extras.push(ex);
  h.matches.splice(mi, 1);
  if(h.matches.length === 0) a.history.splice(hi, 1);
  a.roundsPlayed = a.history.length;
  if(!a.mode || a.mode === 'fixed'){ recomputeTeamAggregates(a); }
  recomputeRatings();
  ratingSummary = null;
  saveArchive(); saveRoster();
  render();
}

// Corpo comune a ogni scheda dell'archivio (turni, extra, correzione/eliminazione, variazioni di rating):
// uguale per tornei a squadre fisse e per Americano/Messicano, perché entrambi salvano m.a/m.b/s1/s2 come stringhe.
function swapTag(a, m){
  if(a.mode && a.mode !== 'fixed') return '';
  const f = matchSwapFlags(a, m);
  return (f.rec && (f.A || f.B)) ? ' <span class="hint" style="font-size:11.5px;" title="Lati Sx/Dx invertiti ('+(f.A && f.B ? 'entrambe le squadre' : (f.A ? 'prima squadra' : 'seconda squadra'))+')">⇄</span>' : '';
}
// ---------- sostituzione di un giocatore in un torneo archiviato ----------
function archiveParticipants(a){
  const ids = [];
  const add = id => { if(id && !ids.includes(id)) ids.push(id); };
  (a.teams || []).forEach(tm => (tm.playerIds || []).forEach(add));
  (a.players || []).forEach(add);
  (a.history || []).forEach(h => h.matches.forEach(m => { (m.pa || []).forEach(add); (m.pb || []).forEach(add); }));
  (a.extras || []).forEach(x => { (x.idsA || []).forEach(add); (x.idsB || []).forEach(add); });
  const nm = archiveIdNames(a);
  return ids.map(id => ({ id, name: (roster[id] && roster[id].name) || nm[id] || id })).sort((x, y) => x.name.localeCompare(y.name));
}
function openArchiveSub(i){ archiveSubDraft = { idx:i }; render(); }
function closeArchiveSub(){ archiveSubDraft = null; render(); }
function archiveSubError(msg){ const el = document.getElementById('asErr'); if(el) el.textContent = msg; }
// segmenti "A & B" di un nome di squadra: sostituisce quello nella posizione indicata (se il numero di segmenti coincide)
function replaceNameSegment(str, pos, newName, count){
  const segs = String(str || '').split(' & ');
  if(pos < 0 || segs.length !== count) return str;
  segs[pos] = newName;
  return segs.join(' & ');
}
function archiveSubApply(a, oldId, newId, from){
  ensureArchiveIds();   // garantisce i giocatori di ogni partita anche nei vecchi archivi
  const newName = roster[newId].name;
  const out = { matches:0, extras:0 };
  const swap = ids => ids.map(x => x === oldId ? newId : x);
  (a.history || []).forEach(h => {
    if(from && h.round < from) return;
    h.matches.forEach(m => {
      const inA = (m.pa || []).indexOf(oldId), inB = (m.pb || []).indexOf(oldId);
      if(inA < 0 && inB < 0) return;
      out.matches++;
      if(inA >= 0){ m.a = replaceNameSegment(m.a, inA, newName, m.pa.length); m.pa = swap(m.pa); }
      if(inB >= 0){ m.b = replaceNameSegment(m.b, inB, newName, m.pb.length); m.pb = swap(m.pb); }
      if(m.sides){ m.sides = { a: swap(m.sides.a || []), b: swap(m.sides.b || []) }; }
    });
  });
  if(!from){
    (a.extras || []).forEach(x => {
      const inA = (x.idsA || []).indexOf(oldId), inB = (x.idsB || []).indexOf(oldId);
      if(inA < 0 && inB < 0) return;
      out.extras++;
      if(inA >= 0){ x.teamA = x.teamA.slice(); x.teamA[inA] = newName; x.idsA = swap(x.idsA); }
      if(inB >= 0){ x.teamB = x.teamB.slice(); x.teamB[inB] = newName; x.idsB = swap(x.idsB); }
      if(x.sides){ x.sides = { a: swap(x.sides.a || []), b: swap(x.sides.b || []) }; }
    });
  }
  const oldName = (roster[oldId] && roster[oldId].name) || oldId;
  (a.teams || []).forEach(tm => {
    const pos = (tm.playerIds || []).indexOf(oldId);
    if(pos < 0) return;
    tm.name = replaceNameSegment(tm.name, pos, newName, tm.playerIds.length);
    if(tm.players){ tm.players = tm.players.slice(); tm.players[pos] = newName; }
    tm.playerIds = swap(tm.playerIds);
    if(from) tm.subs = (tm.subs || []).concat([{ from, out: oldName, in: newName }]);
  });
  if(a.players){
    const still = [];
    (a.history || []).forEach(h => h.matches.forEach(m => still.push(...(m.pa || []), ...(m.pb || []))));
    (a.extras || []).forEach(x => still.push(...(x.idsA || []), ...(x.idsB || [])));
    a.players = swap(a.players);
    if(from && !still.includes(oldId)) a.players = a.players.filter(x => x !== oldId);   // non ha più partite: esce dall'elenco
    a.players = a.players.filter((x, k) => a.players.indexOf(x) === k);
  }
  return out;
}
function confirmArchiveSub(){
  if(!archiveSubDraft) return;
  const i = archiveSubDraft.idx, a = archive[i];
  if(!a) return;
  const oldId = (document.getElementById('asOld') || {}).value;
  const typed = cleanText((document.getElementById('asNewName') || {}).value || '').trim();
  const chosen = (document.getElementById('asNewSel') || {}).value || '';
  const newName = typed || chosen;
  const from = Number((document.getElementById('asFrom') || {}).value) || 0;
  if(!oldId){ archiveSubError('Scegli il giocatore da sostituire.'); return; }
  if(!newName){ archiveSubError('Scegli il nuovo giocatore dalla rubrica o scrivi un nome.'); return; }
  const parts = archiveParticipants(a);
  if(parts.some(x => slug(x.name) === slug(newName))){ archiveSubError(newName+' partecipa già a questo torneo.'); return; }
  const oldName = (parts.find(x => x.id === oldId) || {}).name || oldId;
  if(!confirm('Sostituire '+oldName+' con '+newName+(from ? ' dal turno '+from+' in poi' : ' in tutto il torneo')+'? I rating di tutti i tornei si ricalcolano.')) return;
  upsertPlayer(newName);
  const newId = findIdByName(newName);
  if(!newId){ archiveSubError('Nome non valido.'); return; }
  const res = archiveSubApply(a, oldId, newId, from);
  if(res.matches + res.extras === 0){ archiveSubError(oldName+' non ha partite'+(from ? ' dal turno '+from+' in poi' : '')+' in questo torneo.'); return; }
  recomputeRatings();
  saveRoster();
  saveArchive();
  archiveSubDraft = null;
  dataMsg = 'Giocatore sostituito: '+res.matches+(res.matches===1?' partita':' partite')+(res.extras ? ' e '+res.extras+(res.extras===1?' extra':' extra') : '')+'.';
  render();
}
function archiveSubPanel(a, i){
  const parts = archiveParticipants(a);
  const used = new Set(parts.map(x => slug(x.name)));
  const free = Object.keys(roster).map(k => roster[k].name).filter(n => !used.has(slug(n))).sort((x, y) => x.localeCompare(y));
  let html = '<div class="match-card" style="margin:0 0 12px;"><p class="match-court">Sostituisci un giocatore</p>';
  html += '<label class="field-label">Chi esce</label><select id="asOld"><option value="">— scegli —</option>'+parts.map(x => '<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('')+'</select>';
  html += '<label class="field-label" style="margin-top:8px;">Chi entra</label><select id="asNewSel"><option value="">— scegli dalla rubrica —</option>'+free.map(n => '<option value="'+esc(n)+'">'+esc(n)+'</option>').join('')+'</select>';
  html += '<input id="asNewName" type="text" placeholder="oppure scrivi un nuovo nome" style="margin-top:8px;" />';
  html += '<label class="field-label" style="margin-top:8px;">Da quando</label><select id="asFrom"><option value="0">In tutto il torneo</option>'+(a.history || []).filter(h => h.round > 1).map(h => '<option value="'+h.round+'">Dal turno '+h.round+' in poi</option>').join('')+'</select>';
  html += '<p class="hint" style="margin:8px 0 0;">Le partite interessate passano al nuovo giocatore (lati Sx/Dx compresi) e i rating si ricalcolano. Le partite extra cambiano solo scegliendo "In tutto il torneo".</p>';
  html += '<p class="err" id="asErr"></p>';
  html += '<div class="btn-pair" style="margin-top:8px;"><button class="ghost" onclick="closeArchiveSub()">Annulla</button><button class="primary" onclick="confirmArchiveSub()">Conferma</button></div></div>';
  return html;
}
// ---------- partite extra: conteggi, interruttore dei calcoli, elenco aggregato ----------
function extraWeightOf(x){ return x.weight !== undefined ? x.weight : (x.rating==='full' ? 1 : (x.rating==='reduced' ? EXTRA_K_FACTOR : 0)); }
function extraCounts(list){
  const c = { total:0, full:0, reduced:0, none:0 };
  (list || archive.filter(countsForRatings)).forEach(a => (a.extras || []).forEach(x => {
    const w = extraWeightOf(x);
    c.total++;
    if(w >= 1) c.full++; else if(w > 0) c.reduced++; else c.none++;
  }));
  return c;
}
function extraCountsText(){
  const c = extraCounts();
  if(!c.total) return 'Nessuna partita extra nei tornei archiviati.';
  return c.total+(c.total===1?' partita extra':' partite extra')+': '+c.full+' piene · '+c.reduced+' al 50% · '+c.none+' escluse.';
}
function setExtrasOff(v){
  extrasOff = !!v;
  try{ localStorage.setItem(LS_EXTRAS_OFF, extrasOff ? '1' : '0'); }catch(e){}
  recomputeRatings();
  saveRoster();
  saveArchive();
  render();
}
function extrasToggleHtml(){
  const c = extraCounts();
  if(!c.total) return '';
  return '<div style="margin:0 0 12px;"><p class="hint" style="margin:0 0 6px;">Partite extra nei calcoli · '+esc(extraCountsText())+'</p>'
    + '<div class="seg"><button class="small'+(!extrasOff?' on':'')+'" onclick="setExtrasOff(false)">Come salvate</button>'
    + '<button class="small'+(extrasOff?' on':'')+'" onclick="setExtrasOff(true)">Tutte escluse</button></div></div>';
}
function toggleArchiveExtrasView(){ archiveExtrasView = !archiveExtrasView; render(); }
function openArchiveFromExtras(i){
  archiveExtrasView = false;
  expandedArchiveIdx = i;
  const d = new Date(archive[i].date);
  archiveOpenMonths = new Set([d.getFullYear()+'-'+String(d.getMonth()).padStart(2,'0')]);

// Elenco di tutte le partite extra dei tornei che passano i filtri correnti (per giocatore: solo quelle in cui ha giocato).
function archiveExtrasList(filtered){
  const rows = [];
  filtered.forEach(({a, i, d}) => (a.extras || []).forEach(x => {
    const names = (x.teamA || []).concat(x.teamB || []);
    if(archiveFilterPlayer && !names.includes(archiveFilterPlayer)) return;
    if(archiveSearchText.trim() && !names.some(n => n.toLowerCase().includes(archiveSearchText.trim().toLowerCase()))) return;
    rows.push({ a, i, d, x });
  }));
  let html = extrasToggleHtml();
  if(!rows.length) return html + '<p class="roster-empty" style="margin-top:10px;">Nessuna partita extra corrisponde ai filtri.</p>';
  const w = r => extraWeightOf(r.x);
  const cnt = { full: rows.filter(r => w(r) >= 1).length, reduced: rows.filter(r => w(r) > 0 && w(r) < 1).length, none: rows.filter(r => w(r) === 0).length };
  html += '<p class="hint" style="margin:0 0 8px;">'+rows.length+(rows.length===1?' partita extra':' partite extra')+' nei filtri: '+cnt.full+' piene · '+cnt.reduced+' al 50% · '+cnt.none+' escluse.</p>';
  let lastIdx = -1;
  rows.forEach(r => {
    if(r.i !== lastIdx){
      lastIdx = r.i;
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 4px;"><p class="section-label" style="margin:0;">'+esc(r.d.toLocaleDateString('it-IT', { day:'numeric', month:'long', year:'numeric' }))+((r.a.mode && r.a.mode !== 'fixed') ? ' · '+esc(r.a.mode) : '')+(r.a.excluded ? ' · torneo escluso' : '')+'</p><button class="small" onclick="openArchiveFromExtras('+r.i+')">Apri torneo</button></div>';
    }
    html += '<div class="history-match extra-row"><span>'+esc(r.x.teamA.join(' & '))+' vs '+esc(r.x.teamB.join(' & '))+'<span class="extra-tag">'+extraTag(r.x)+(extrasOff ? ' · ora esclusa dal confronto' : '')+'</span></span><span class="extra-side">'+r.x.s1+' &ndash; '+r.x.s2+(r.x.tb ? ' <span class="tb-inline">(tb '+r.x.tb[0]+'-'+r.x.tb[1]+')</span>' : '')+'</span></div>';
  });
  return html;
}

// Spostare una partita archiviata in un altro turno (modalità "Correggi"): serve quando è stata registrata nel turno sbagliato.
function archiveMoveRoundRow(a, hi, mi){
  const cur = a.history[hi].round;
  const opts = a.history.map(h => '<option value="'+h.round+'"'+(h.round === cur ? ' selected' : '')+'>Turno '+h.round+'</option>').join('');
  return '<div class="swap-row" style="grid-template-columns:auto 1fr;align-items:center;"><span>Spostala in</span><select id="ea_'+hi+'_'+mi+'_rd">'+opts+'<option value="new">Nuovo turno (in coda)</option></select></div>';
}
function matchIdsForRound(a, m){
  if(!a.mode || a.mode === 'fixed') return [ 't'+m.aId, 't'+m.bId ];
  return (m.pa || []).concat(m.pb || []);
}
function archiveMoveLabel(a, id){
  if(String(id).startsWith('t') && (!a.mode || a.mode === 'fixed')){ const tm = a.teams[Number(String(id).slice(1))]; return tm ? tm.name : 'una squadra'; }
  return (roster[id] && roster[id].name) || id;
}
// Controlla che dopo gli spostamenti nessuna squadra (o giocatore) giochi due volte nello stesso turno.
function archiveMovesConflict(a, moves){
  const target = new Map();
  moves.forEach(mv => target.set(mv.hi+'|'+mv.mi, mv.to));
  const newRound = a.history.reduce((mx, h) => Math.max(mx, h.round || 0), 0) + 1;
  const byRound = {};
  let found = null;
  a.history.forEach((h, hi) => h.matches.forEach((m, mi) => {
    const to = target.has(hi+'|'+mi) ? target.get(hi+'|'+mi) : h.round;
    const rn = to === 'new' ? newRound : Number(to);
    if(!byRound[rn]) byRound[rn] = new Set();
    for(const id of matchIdsForRound(a, m)){
      if(byRound[rn].has(id)){ if(!found) found = { round: rn, who: archiveMoveLabel(a, id) }; }
      byRound[rn].add(id);
    }
  }));
  return found;
}
function archiveApplyMoves(a, moves){
  const target = new Map();
  moves.forEach(mv => target.set(mv.hi+'|'+mv.mi, mv.to));
  const newRoundNo = a.history.reduce((mx, h) => Math.max(mx, h.round || 0), 0) + 1;
  const rounds = new Map();
  a.history.forEach(h => rounds.set(h.round, { ...h, matches: [] }));
  a.history.forEach((h, hi) => h.matches.forEach((m, mi) => {
    const key = hi+'|'+mi;
    let rn = h.round;
    if(target.has(key)){
      rn = target.get(key) === 'new' ? newRoundNo : Number(target.get(key));
      if(!rounds.has(rn)) rounds.set(rn, { round: rn, resting: [], matches: [] });
      // chi gioca in questo turno non può risultare a riposo
      const used = matchIdsForRound(a, m).map(id => (String(id).startsWith('t') && (!a.mode || a.mode === 'fixed')) ? Number(String(id).slice(1)) : id);
      const r = rounds.get(rn);
      r.resting = (r.resting || []).filter(x => !used.includes(x));
    }
    rounds.get(rn).matches.push(m);
  }));
  rounds.forEach(r => {   // chi gioca in un turno non può risultare a riposo in quello stesso turno
    const used = [];
    r.matches.forEach(m => matchIdsForRound(a, m).forEach(id => used.push((String(id).startsWith('t') && (!a.mode || a.mode === 'fixed')) ? Number(String(id).slice(1)) : id)));
    r.resting = (r.resting || []).filter(x => !used.includes(x));
  });
  a.history = [...rounds.values()].filter(h => h.matches.length > 0).sort((x, y) => x.round - y.round);
  a.history.forEach(h => h.matches.forEach((m, k) => { m.court = k; }));
  a.roundsPlayed = a.history.length;
}
function sideInline(n1, n2, sw){
  const p = sw ? [n2, n1] : [n1, n2];
  return esc(p[0])+' &amp; '+esc(p[1]);
}
function toggleArchSwap(pre, which){
  const chk = document.getElementById(pre+'_sw'+which), lbl = document.getElementById(pre+'_lbl'+which);
  if(!chk || !lbl) return;
  chk.checked = !chk.checked;
  lbl.innerHTML = sideInline(lbl.dataset.n1, lbl.dataset.n2, chk.checked);
}
// Titolo della partita in "Correggi": i nomi di ogni squadra nell'ordine dei lati registrato (primo = Sx); il pulsante ⇄ li scambia sul posto.
function archMatchTitle(a, m, hi, mi){
  const f = matchSwapFlags(a, m), vs = ' <span style="opacity:.7;">vs</span> ';
  if(!f.usable) return esc(m.a)+vs+esc(m.b);
  const nmOf = archiveIdNames(a), nameFor = id => (roster[id] && roster[id].name) || nmOf[id] || id, pre = 'ea_'+hi+'_'+mi;
  const lbl = (w, ids, on) => '<span id="'+pre+'_lbl'+w+'" data-n1="'+esc(nameFor(ids[0]))+'" data-n2="'+esc(nameFor(ids[1]))+'">'+sideInline(nameFor(ids[0]), nameFor(ids[1]), on)+'</span>';
  return lbl('A', f.base.a, f.A)+vs+lbl('B', f.base.b, f.B);
}
function archiveSwapRow(a, m, hi, mi){
  const f = matchSwapFlags(a, m);
  if(!f.usable) return '';
  const pre = 'ea_'+hi+'_'+mi;
  const cell = (w, on, right) => '<div><button class="ghost swapbtn'+(right ? ' right' : '')+'" title="Inverti l\'ordine dei nomi (lati Sx/Dx)" onclick="toggleArchSwap(\''+pre+'\',\''+w+'\')">&#8644; Inverti</button>'
    + '<input type="checkbox" id="'+pre+'_sw'+w+'" '+(on ? 'checked' : '')+' style="display:none;" /></div>';

const venueTag = a => a.venue ? ' · 📍 '+esc(a.venue) : '';
function archiveFixedCard(a, i){
  const dateStr = new Date(a.date).toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'numeric'});
  function archBuchholz(teamIdx){
    let sum = 0;
    (a.history||[]).forEach(h => h.matches.forEach(m => {
      if(m.aId===teamIdx){ const opp=a.teams[m.bId]; if(opp) sum += opp.wins; }
      else if(m.bId===teamIdx){ const opp=a.teams[m.aId]; if(opp) sum += opp.wins; }
    }));
    return sum;
  }
  const sorted = a.teams.map((tm,idx)=>({...tm, _idx:idx})).sort((x,y)=> y.wins-x.wins || (y.setsWon-y.setsLost)-(x.setsWon-x.setsLost) || archBuchholz(y._idx)-archBuchholz(x._idx));
  const ranks = computeRanks(sorted, tm => tm.wins+'-'+(tm.setsWon-tm.setsLost));
  let html = '<div class="team-card"><div class="team-card-head">';
  html += '<p class="section-label">'+dateStr+venueTag(a)+' · '+a.teams.length+' squadre · '+a.roundsPlayed+' turni'+excTag(a)+'</p>';
  html += '<button class="small" onclick="toggleArchiveExpand('+i+')">'+(expandedArchiveIdx===i ? 'Chiudi' : 'Dettagli')+'</button>';
  html += '</div>';
  sorted.forEach((tm,pos) => {
    const r = ranks[pos];
    html += '<div class="history-match"><span><b>'+rankLabel(r)+'. '+esc(tm.name)+'</b>'+(tm.out ? ' <span class="prov">ritirata</span>' : '')+'</span><span>'+tm.wins+' V · '+tm.setsWon+'-'+tm.setsLost+'</span></div>';
  });
  a.teams.forEach(tm => {
    (tm.subs || []).forEach(sb => { html += '<p class="hint" style="margin:6px 0 0;">Sostituzione in '+esc(tm.name)+': '+esc(sb.out)+' &rarr; '+esc(sb.in)+' (dal turno '+sb.from+')</p>'; });
    if(tm.out) html += '<p class="hint" style="margin:6px 0 0;">'+esc(tm.name)+' ritirata dal turno '+tm.outFrom+'</p>';
  });
  if(expandedArchiveIdx === i){ html += archiveDetailBody(a, i); }
  html += '</div>';
  return html;
}

function archiveRotatingCard(a, i){
  const dateStr = new Date(a.date).toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'numeric'});
  const label = a.mode === 'messicano' ? 'Messicano' : 'Americano';
  const standings = archivePlayerStandings(a);
  const ranks = computeRanks(standings, r => r.wins+'-'+(r.gW-r.gL));
  let html = '<div class="team-card"><div class="team-card-head">';
  html += '<p class="section-label">'+dateStr+venueTag(a)+' · '+(a.players ? a.players.length : standings.length)+' giocatori · '+a.roundsPlayed+' turni · '+label+excTag(a)+'</p>';
  html += '<button class="small" onclick="toggleArchiveExpand('+i+')">'+(expandedArchiveIdx===i ? 'Chiudi' : 'Dettagli')+'</button>';
  html += '</div>';
  standings.forEach((r,pos) => {
    const rk = ranks[pos];
    html += '<div class="history-match"><span><b>'+rankLabel(rk)+'. '+esc(r.name)+'</b></span><span>'+r.wins+' V · '+r.gW+'-'+r.gL+'</span></div>';
  });
  if(expandedArchiveIdx === i){ html += archiveDetailBody(a, i); }
  html += '</div>';
  return html;
}

function archiveView(){
  let html = '<section><p class="section-label">Tornei passati</p>';
  if(archive.length === 0){
    html += '<p class="roster-empty">Nessun torneo ancora completato.</p>';
    html += '</section>';

  }
  const MONTHS = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const entries = archive.map((a,i) => ({ a, i, d: new Date(a.date) }));
  const years = Array.from(new Set(entries.map(e => e.d.getFullYear()))).sort((a,b)=> b-a);
  const playerNames = Array.from(new Set(entries.flatMap(e => archiveParticipantNames(e.a)))).sort((x,y)=>x.localeCompare(y));

  html += '<select onchange="setArchiveFilterMonth(this.value)"><option value="">Tutti i mesi</option>'+MONTHS.map((m,idx) => '<option value="'+idx+'"'+(String(archiveFilterMonth)===String(idx)?' selected':'')+'>'+m+'</option>').join('')+'</select>';
  html += '</div>';
  html += '<div class="team-players" style="margin-top:8px;">';
  html += '<select onchange="setArchiveFilterMode(this.value)"><option value="">Tutte le modalità</option><option value="fixed"'+(archiveFilterMode==='fixed'?' selected':'')+'>Squadre fisse</option><option value="americano"'+(archiveFilterMode==='americano'?' selected':'')+'>Americano</option><option value="messicano"'+(archiveFilterMode==='messicano'?' selected':'')+'>Messicano</option></select>';
  html += '<select onchange="setArchiveFilterPlayer(this.value)"><option value="">Tutti i giocatori</option>'+playerNames.map(n => '<option value="'+esc(n)+'"'+(archiveFilterPlayer===n?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select>';
  html += '</div>';
  const venueOpts = Array.from(new Set(archive.map(a => a.venue).filter(Boolean))).sort((x,y)=>x.localeCompare(y));
  if(venueOpts.length){
    html += '<select onchange="setArchiveFilterVenue(this.value)" style="margin-top:8px;width:100%;"><option value="">Tutti i luoghi</option>'+venueOpts.map(v => '<option value="'+esc(v)+'"'+(archiveFilterVenue===v?' selected':'')+'>'+esc(v)+'</option>').join('')+'</select>';
  }
  html += '<input type="text" placeholder="Cerca per nome o luogo…" value="'+esc(archiveSearchText)+'" oninput="setArchiveSearchText(this.value)" style="margin-top:8px;width:100%;" />';
  if(archiveFilterYear || archiveFilterMonth!=='' || archiveFilterMode || archiveFilterPlayer || archiveFilterVenue || archiveSearchText){
    html += '<button class="ghost" style="margin-top:8px;" onclick="clearArchiveFilters()">Azzera filtri</button>';
  }

  const exCountAll = extraCounts(archive).total;
  if(exCountAll > 0){
    html += '<button class="ghost'+(archiveExtrasView ? ' back-active' : '')+'" style="margin-top:8px;" onclick="toggleArchiveExtrasView()">'+(archiveExtrasView ? 'Torna ai tornei' : 'Tutte le partite extra ('+exCountAll+')')+'</button>';
  }
  const q = archiveSearchText.trim().toLowerCase();
  const filtered = entries.filter(e => {
    if(archiveFilterYear && String(e.d.getFullYear()) !== String(archiveFilterYear)) return false;
    if(archiveFilterMonth !== '' && String(e.d.getMonth()) !== String(archiveFilterMonth)) return false;
    const modeKey = e.a.mode || 'fixed';
    if(archiveFilterMode && modeKey !== archiveFilterMode) return false;
    const names = archiveParticipantNames(e.a);
    if(archiveFilterPlayer && !names.includes(archiveFilterPlayer)) return false;
    if(archiveFilterVenue && (e.a.venue || '') !== archiveFilterVenue) return false;
    if(q && !names.some(n => n.toLowerCase().includes(q)) && !(e.a.venue || '').toLowerCase().includes(q)) return false;
    return true;
  }).sort((x,y)=> y.d - x.d);

  if(filtered.length === 0){
    html += '<p class="roster-empty" style="margin-top:10px;">Nessun torneo corrisponde ai filtri.</p>';
    html += '</section>';
    return html;
  }

  if(archiveExtrasView){
    html += archiveExtrasList(filtered);
    html += '</section>';
    return html;
  }
  const visible = filtered.slice(0, archivePageSize);
  const groups = [];
  visible.forEach(e => {
    const key = e.d.getFullYear()+'-'+String(e.d.getMonth()).padStart(2,'0');
    let g = groups.find(g => g.key === key);
    if(!g){ g = { key, label: MONTHS[e.d.getMonth()]+' '+e.d.getFullYear(), items: [] }; groups.push(g); }
    g.items.push(e);
  });
  if(!archiveOpenMonths){ archiveOpenMonths = new Set(groups.length ? [groups[0].key] : []); }
  groups.forEach(g => {
    const open = archiveOpenMonths.has(g.key);
    html += '<button class="ghost" style="display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:10px;" onclick="toggleArchiveMonth('+jsArg(g.key)+')"><b>'+g.label+' ('+g.items.length+')</b><span>'+(open?'▾':'▸')+'</span></button>';
    if(open){
      g.items.forEach(({a,i}) => {
        html += (a.mode && a.mode !== 'fixed') ? archiveRotatingCard(a, i) : archiveFixedCard(a, i);
      });
    }
  });
  if(filtered.length > visible.length){
    html += '<button class="ghost" style="margin-top:10px;" onclick="showMoreArchive()">Mostra altri 20 ('+(filtered.length-visible.length)+' rimasti)</button>';
  }
  html += '</section>';
  return html;
}

// ---------- partite extra ----------

// ---------- Americano / Messicano: compagni variabili, punteggio individuale ----------
// I turni non sono persistiti come "squadre": ogni partita salva direttamente le coppie di id
// (m.pa/m.pb), quindi non serve nessuna struttura extra per annullare, correggere o chiudere il torneo.

function pk2(a, b){ return [a,b].sort().join('|'); }

// Statistiche individuali di QUESTO torneo, ricavate dai turni già giocati (mai salvate a parte).
function liveIndividualStats(){
  const st = {};
  (t.players || []).forEach(id => { st[id] = { matches:0, wins:0, gW:0, gL:0 }; });
  (t.history || []).forEach(h => h.matches.forEach(m => {
    const win = matchWinner(m.s1, m.s2, m.tb);
    (m.pa || []).forEach(id => { if(st[id]){ st[id].matches++; st[id].gW += m.s1; st[id].gL += m.s2; if(win===1) st[id].wins++; } });
    (m.pb || []).forEach(id => { if(st[id]){ st[id].matches++; st[id].gW += m.s2; st[id].gL += m.s1; if(win===0) st[id].wins++; } });
  }));
  return st;
}

// Chi ha già giocato con/contro chi in questo torneo, per evitare ripetizioni nei turni successivi.
function rotatingHistoryKeys(){
  const partners = new Set(), opponents = new Set();
  (t.history || []).forEach(h => h.matches.forEach(m => {
    partners.add(pk2(m.pa[0], m.pa[1]));
    partners.add(pk2(m.pb[0], m.pb[1]));
    m.pa.forEach(x => m.pb.forEach(y => opponents.add(pk2(x,y))));
  }));
  return { partners, opponents };
}

// Forza di riferimento per il primo turno (prima che ci siano risultati): Elo o Glicko-2, come per i suggerimenti.
function rotatingStrengthFn(){
  const gm = strengthMap();
  const byId = roster;  // la chiave della rubrica È l'id
  return id => gm ? (gm[id] !== undefined ? gm[id] : START_ELO) : (byId[id] ? byId[id].elo : START_ELO);
}

// Messicano: si riordina a ogni turno in base alla classifica di questa serata (a parità, alla forza di partenza),
// si raggruppa a blocchi di 4 nell'ordine, e in ogni blocco si abbina 1°+4° contro 2°+3°, evitando una coppia già giocata insieme.
function messicanoGroups(playing, matchesCount){
  const st = liveIndividualStats(), strOf = rotatingStrengthFn();
  const { partners } = rotatingHistoryKeys();
  const sorted = [...playing].sort((a,b) => {
    const sa = st[a], sb = st[b];
    return (sb.wins - sa.wins) || ((sb.gW-sb.gL) - (sa.gW-sa.gL)) || (sb.gW - sa.gW) || (strOf(b) - strOf(a));
  });
  const groups = [];
  for(let i = 0; i < matchesCount; i++){
    const g = sorted.slice(i*4, i*4+4);
    const options = [[[0,3],[1,2]], [[0,2],[1,3]], [[0,1],[2,3]]];
    let chosen = null;
    for(const [ia, ib] of options){
      const pa = [g[ia[0]], g[ia[1]]], pb = [g[ib[0]], g[ib[1]]];
      if(!partners.has(pk2(pa[0],pa[1])) && !partners.has(pk2(pb[0],pb[1]))){ chosen = [pa,pb]; break; }
    }
    if(!chosen){ chosen = [[g[0],g[3]],[g[1],g[2]]]; }
    groups.push(chosen);
  }
  return groups;
}

// Americano: si mescola tutto il gruppo e si formano squadre di 2 cercando di non ripetere compagni o avversari
// e di tenere le due coppie di un campo equilibrate per forza. Si provano più mescolate a caso e si tiene la migliore.
function americanoGroups(playing, matchesCount){
  const strOf = rotatingStrengthFn();
  const { partners, opponents } = rotatingHistoryKeys();
  const pairingsOf4 = [[[0,1],[2,3]], [[0,2],[1,3]], [[0,3],[1,2]]];
  let best = null, bestCost = Infinity;
  for(let attempt = 0; attempt < 300; attempt++){
    const pool = shuffle(playing);
    const groups = [];
    let cost = 0;
    for(let i = 0; i < matchesCount; i++){
      const g = pool.slice(i*4, i*4+4);
      let gBest = null, gCost = Infinity;
      pairingsOf4.forEach(([ia, ib]) => {
        const pa = [g[ia[0]], g[ia[1]]], pb = [g[ib[0]], g[ib[1]]];
        let c = 0;
        if(partners.has(pk2(pa[0],pa[1]))) c += 1000;
        if(partners.has(pk2(pb[0],pb[1]))) c += 1000;
        pa.forEach(x => pb.forEach(y => { if(opponents.has(pk2(x,y))) c += 10; }));
        c += Math.abs((strOf(pa[0])+strOf(pa[1])) - (strOf(pb[0])+strOf(pb[1]))) / 50;
        if(c < gCost){ gCost = c; gBest = [pa,pb]; }
      });
      groups.push(gBest);
      cost += gCost;
    }
    if(cost < bestCost){ bestCost = cost; best = groups; }
  }
  return best;
}

function generateRotatingRound(){
  t.round++;
  const pool = t.players.slice();
  const matchesCount = Math.min(t.courts, Math.floor(pool.length/4));
  const restingCount = pool.length - matchesCount*4;
  let restIds = [];
  if(restingCount > 0){
    const byRest = shuffle(pool).sort((a,b) => (t.restCounts[a]||0) - (t.restCounts[b]||0));
    restIds = byRest.slice(0, restingCount);
    restIds.forEach(id => { t.restCounts[id] = (t.restCounts[id]||0) + 1; });
  }
  const playing = pool.filter(id => !restIds.includes(id));
  const groups = (t.mode === 'messicano') ? messicanoGroups(playing, matchesCount) : americanoGroups(playing, matchesCount);
  // Dentro ogni coppia il primo è Sx e il secondo Dx: se i lati dichiarati in rubrica sono opposti li si mette nell'ordine giusto.
  const sideFirst = pair => (roster[pair[0]] && roster[pair[0]].side === 'Dx' && roster[pair[1]] && roster[pair[1]].side === 'Sx') ? [pair[1], pair[0]] : pair;
  t.currentMatches = groups.map(([pa,pb], court) => { pa = sideFirst(pa); pb = sideFirst(pb); return { pa, pb, aName: pa.map(playerName).join(' & '), bName: pb.map(playerName).join(' & '), court }; });
  t.restingThisRound = restIds;
  roundDraft = {};
  pairEdit = null;
  snapshotSuggestion();
  saveTournament();
  render();
}

function submitRotatingResults(){
  let valid = true;
  t.currentMatches.forEach((m,idx) => {
    const s1raw = document.getElementById('s1_'+idx).value, s2raw = document.getElementById('s2_'+idx).value;
    if(s1raw==='' || s2raw===''){ valid = false; return; }
    const s1 = Number(s1raw), s2 = Number(s2raw);
    if(!scoreIsPlausible(s1, s2)){ valid = false; return; }
    if(isTiedSix(s1, s2)){
      const tb1raw = document.getElementById('tb1_'+idx).value, tb2raw = document.getElementById('tb2_'+idx).value;
      if(tb1raw===''||tb2raw===''||!tiebreakIsPlausible(Number(tb1raw), Number(tb2raw))){ valid = false; }
    }
  });
  if(!valid){ document.getElementById('err').textContent = 'Controlla i punteggi: sopra il 6 lo scarto può essere al massimo di 2 game; sul 6-6 inserisci anche il tie-break (chi arriva a 7 con almeno 2 di scarto).'; return; }
  const roundResults = t.currentMatches.map((m,idx) => {
    const s1 = parseInt(document.getElementById('s1_'+idx).value), s2 = parseInt(document.getElementById('s2_'+idx).value);
    const tb = isTiedSix(s1, s2) ? [parseInt(document.getElementById('tb1_'+idx).value), parseInt(document.getElementById('tb2_'+idx).value)] : undefined;
    const gmP = strengthMap();
    const av = teamStrengthIds(m.pa, gmP), bv = teamStrengthIds(m.pb, gmP);
    // Lato di gioco: l'ordine nella coppia è Sx/Dx; la spunta "lati invertiti" lo capovolge per questa partita.
    const rd = roundDraft[idx] || {};
    const sides = { a: rd.swA ? m.pa.slice().reverse() : m.pa.slice(), b: rd.swB ? m.pb.slice().reverse() : m.pb.slice() };
    const rec = { pa:m.pa, pb:m.pb, a: m.aName, b: m.bName, s1, s2, tb, court: idx, sides };
    if(av !== null && bv !== null) rec.pA = Math.round(winProb(av, bv) * 1000) / 1000;
    return rec;
  });
  t.history.push({ round:t.round, resting:(t.restingThisRound||[]), matches:roundResults });
  t.currentMatches = [];
  roundDraft = {};
  pairEdit = null;
  saveTournament();
  render();
}

function undoRotatingRound(){
  if(t.history.length === 0) return;
  const last = t.history.pop();
  t.currentMatches = last.matches.map(m => ({ pa:m.pa, pb:m.pb, aName:m.a, bName:m.b, court:m.court }));
  (last.resting || []).forEach(id => { if(t.restCounts[id] > 0) t.restCounts[id]--; });
  t.restingThisRound = last.resting || [];
  roundDraft = {};
  last.matches.forEach((m, idx) => { if(m.sides){ roundDraft[idx] = { swA: m.sides.a[0] !== m.pa[0], swB: m.sides.b[0] !== m.pb[0] }; } });
  pairEdit = null;
  saveTournament();
  render();
}

function startRotatingTournament(){
  const players = Array.from(selected).filter(k => roster[k]);
  if(!t.courts || t.courts < 1){ document.getElementById('setupErr').textContent = 'Indica quanti campi avete.'; return; }
  if(!t.maxRounds || t.maxRounds < 1){ document.getElementById('setupErr').textContent = 'Indica quanti turni volete giocare.'; return; }
  if(players.length < 4){ document.getElementById('setupErr').textContent = 'Servono almeno 4 giocatori.'; return; }
  document.getElementById('setupErr').textContent = '';

  const mode = pendingMode, courts = t.courts, maxRounds = t.maxRounds, unofficial = !!t.unofficial, venue = cleanVenue(t.venue);
  t = { phase:'playing', mode, venue, courts, maxRounds, unofficial, players, round:0, currentMatches:[], history:[], restCounts:{}, extras:[] };
  players.forEach(id => { t.restCounts[id] = 0; });
  roundDraft = {};
  pairEdit = null;
  saveTournament();
  pendingMode = 'fixed';
  render();
}

function saveExtra(){
  const d = extraDraft;
  const err = document.getElementById('extraErr');
  const names = [d.a1, d.a2, d.b1, d.b2];
  if(names.some(n => !n)){ err.textContent = 'Scegli tutti e quattro i giocatori.'; return; }
  if(new Set(names).size !== 4){ err.textContent = 'Ogni giocatore può comparire una sola volta.'; return; }
  const s1 = Number(d.s1), s2 = Number(d.s2);
  const isInt = Number.isInteger(s1) && Number.isInteger(s2) && s1>=0 && s2>=0;
  if(d.s1==='' || d.s2==='' || !isInt || s1+s2===0){
    err.textContent = 'Inserisci un punteggio con numeri interi (va bene anche una partita interrotta).'; return;
  }
  if(!scoreIsPlausible(s1, s2)){
    err.textContent = 'Sopra il 6 lo scarto può essere al massimo di 2 game: la partita sarebbe già finita.'; return;
  }
  let tb;
  if(isTiedSix(s1, s2)){
    const tb1 = Number(d.tb1), tb2 = Number(d.tb2);
    if(d.tb1==='' || d.tb2==='' || !tiebreakIsPlausible(tb1, tb2)){
      err.textContent = 'Sul 6-6 inserisci il punteggio del tie-break (chi arriva a 7 con almeno 2 di scarto).'; return;
    }
    tb = [tb1, tb2];
  }
  const rating = t.unofficial ? 'none' : d.rating;
  // Il peso viene salvato come numero: l'archivio resta ricalcolabile anche se in futuro cambiano le costanti.
  const weight = rating==='full' ? 1 : (rating==='reduced' ? EXTRA_K_FACTOR : 0);
  t.extras.push({ id: Date.now(), teamA:[d.a1,d.a2], teamB:[d.b1,d.b2], s1, s2, tb, rating, weight });
  extraDraft = null;
  saveTournament();
  render();
}

// ---------- posizioni e frecce: confronto tra la classifica dopo l'ultimo torneo archiviato e quella dopo il penultimo ----------

function positionsElo(list, minP){
  const st = computeEloStates(list, false);
  const rows = activeKeys()
    .map(id => { const p = roster[id]; return { id, name:p.name, elo: st[id] ? st[id].elo : p.elo0, matches: st[id] ? st[id].matches : (p.matches0||0), frozen:!!p.frozen }; })
    .filter(r => r.matches > 0 && r.matches >= (minP || 1) && !r.frozen)
    .sort((a,b)=> b.elo-a.elo || a.name.localeCompare(b.name));
  const ranks = computeRanks(rows, r => Math.round(r.elo));
  const m = {}; rows.forEach((r,i) => { m[r.id] = ranks[i].rank; });
  return m;
}
function positionsWin(list){
  const st = computeEloStates(list, false);
  const rows = activeKeys().map(id => {
    const p = roster[id];
    const sv = st[id] || { matches:p.matches0||0, wins:p.wins0||0 };
    return { id, name:p.name, matches:sv.matches, wr: sv.matches>0 ? sv.wins/sv.matches : null, frozen:!!p.frozen };
  }).filter(r => r.matches >= MIN_MATCHES_WINRATE && !r.frozen).sort((a,b)=> b.wr-a.wr || b.matches-a.matches || a.name.localeCompare(b.name));
  const ranks = computeRanks(rows, r => Math.round(r.wr*100));
  const m = {}; rows.forEach((r,i) => { m[r.id] = ranks[i].rank; });
  return m;
}
function positionsGlicko(list, minP){
  const rows = computeGlicko(list)
    .filter(r => !(roster[r.id] && roster[r.id].frozen) && r.games >= (minP || 1))
    .sort((a,b)=> b.rating-a.rating || a.name.localeCompare(b.name));
  const ranks = computeRanks(rows, r => Math.round(r.rating));
  const m = {}; rows.forEach((r,i) => { m[r.id] = ranks[i].rank; });
  return m;
}
function positionsTeams(list){
  const rows = teamStats(list, false, calc.teamRot).filter(x=>x.matches>=(calc.teamMin||1)).sort((a,b)=>{
    const wa = a.wins/a.matches, wb = b.wins/b.matches;
    return wb-wa || (b.setsWon-b.setsLost)-(a.setsWon-a.setsLost) || a.name.localeCompare(b.name);
  });
  const ranks = computeRanks(rows, tm => Math.round((tm.wins/tm.matches)*100));
  const m = {}; rows.forEach((tm,i) => { m[tm.key] = ranks[i].rank; });
  return m;
}
// cur = posizioni dopo l'ultimo torneo archiviato, prev = dopo il penultimo (null se ce n'è uno solo o nessuno)
function movement(fn, list, minP){
  list = list || archive;
  return { cur: fn(list, minP), prev: list.length >= 2 ? fn(list.slice(0, -1), minP) : null };
}
function arrow(mv, key){
  if(!mv.prev || mv.cur[key] === undefined) return '<span class="delta same">&ndash;</span>';
  return deltaTag(mv.prev[key], mv.cur[key]);
}
function deltaTag(prevRank, currentIdx){
  if(prevRank === undefined) return '<span class="delta new">nuovo</span>';
  const d = prevRank - currentIdx;
  if(d > 0) return '<span class="delta up">&#9650;'+d+'</span>';
  if(d < 0) return '<span class="delta down">&#9660;'+Math.abs(d)+'</span>';
  return '<span class="delta same">&ndash;</span>';
}

// ---------- Glicko-2 (calcolato dall'archivio: ogni torneo chiuso è un periodo di valutazione) ----------

const G2_SCALE = 173.7178, G2_TAU = 0.5, G2_INIT_SIGMA = 0.06, G2_INIT_PHI = 350/173.7178;
const G2_BASE = START_ELO;   // scala centrata come l'Elo dell'app, così i numeri sono confrontabili

function g2g(phi){ return 1/Math.sqrt(1+3*phi*phi/(Math.PI*Math.PI)); }
function g2E(mu, muJ, phiJ){ return 1/(1+Math.exp(-g2g(phiJ)*(mu-muJ))); }

// pl: {mu, phi, sigma} — games: [{mu, phi, s, w}] (w = peso della partita, 1 = piena)
function g2Update(pl, games){
  const cap = 350/G2_SCALE;
  if(games.length === 0){
    return { mu:pl.mu, phi:Math.min(cap, Math.sqrt(pl.phi*pl.phi + pl.sigma*pl.sigma)), sigma:pl.sigma };
  }
  let vInv = 0, dSum = 0;
  games.forEach(gm => {
    const g = g2g(gm.phi), E = g2E(pl.mu, gm.mu, gm.phi);
    vInv += gm.w*g*g*E*(1-E);
    dSum += gm.w*g*(gm.s-E);
  });
  const v = 1/vInv, delta = v*dSum;
  const a = Math.log(pl.sigma*pl.sigma), tau2 = G2_TAU*G2_TAU, phi2 = pl.phi*pl.phi;
  const f = x => { const ex = Math.exp(x); return ex*(delta*delta-phi2-v-ex)/(2*Math.pow(phi2+v+ex,2)) - (x-a)/tau2; };
  let A = a, B;
  if(delta*delta > phi2+v){ B = Math.log(delta*delta-phi2-v); }
  else { let k = 1; while(f(a-k*G2_TAU) < 0 && k < 100) k++; B = a-k*G2_TAU; }
  let fA = f(A), fB = f(B), iter = 0;
  while(Math.abs(B-A) > 1e-6 && iter++ < 100){
    const C = A + (A-B)*fA/(fB-fA), fC = f(C);
    if(fC*fB < 0){ A = B; fA = fB; } else { fA = fA/2; }
    B = C; fB = fC;
  }
  const sigmaNew = Math.exp(A/2);
  const phiStar = Math.sqrt(phi2 + sigmaNew*sigmaNew);
  const phiNew = 1/Math.sqrt(1/(phiStar*phiStar) + 1/v);
  return { mu: pl.mu + phiNew*phiNew*dSum, phi: Math.min(cap, phiNew), sigma: sigmaNew };
}

function computeGlicko(list, hook, opts){
  const scoreFn = (opts && opts.scoreFn) || gameScore;
  list = (list || archive).filter(countsForRatings);
  const byId = roster;  // la chiave della rubrica È l'id
  const P = {};
  const get = id => {
    if(!P[id]){
      const base = byId[id] ? startState(id).elo : G2_BASE;  // parte dallo stesso rating iniziale impostato per l'Elo (utile per gli ospiti "congelati")
      P[id] = { id, mu:(base - G2_BASE)/G2_SCALE, phi:G2_INIT_PHI, sigma:G2_INIT_SIGMA, games:0, seen:false };
    }
    return P[id];
  };
  list.forEach((a, pi) => {
    const gamesOf = {};
    archiveGames(a).forEach(gm => {
      const A = gm.idsA.map(get), B = gm.idsB.map(get);
      if(A.length === 0 || B.length === 0) return;
      if(hook) hook(A, B, gm, pi);
      const S = scoreFn(gm.s1, gm.s2, gm.tb);
      const muA = A.reduce((x,y)=>x+y.mu,0)/A.length, muB = B.reduce((x,y)=>x+y.mu,0)/B.length;
      const varOf = team => team.reduce((x,y)=>x+y.phi*y.phi,0);
      function addFor(own, opp, diff, sc){
        own.forEach(pl => {
          // L'avversario "equivalente" tiene conto del compagno: la differenza di forza è quella tra le due coppie.
          const partnersVar = varOf(own) - pl.phi*pl.phi;
          const phiOpp = Math.sqrt(varOf(opp)/(opp.length*opp.length) + partnersVar/(own.length*own.length));
          (gamesOf[pl.id] = gamesOf[pl.id] || []).push({ mu: pl.mu - diff, phi: phiOpp, s: sc, w: gm.weight });
        });
      }
      addFor(A, B, muA-muB, S);
      addFor(B, A, muB-muA, 1-S);
      A.concat(B).forEach(pl => { pl.seen = true; pl.games++; });
    });
    // Tutti i giocatori già visti si aggiornano insieme, a partire dallo stato di inizio periodo.
    const next = {};
    Object.values(P).forEach(pl => { if(pl.seen && !(byId[pl.id] && byId[pl.id].frozen)) next[pl.id] = g2Update(pl, gamesOf[pl.id] || []); });
    Object.keys(next).forEach(id => Object.assign(P[id], next[id]));
  });
  return Object.values(P)
    .filter(pl => pl.games > 0 && byId[pl.id] && !byId[pl.id].hidden)
    .map(pl => ({ id:pl.id, name:byId[pl.id].name, games:pl.games, rating: G2_BASE + G2_SCALE*pl.mu, rd: G2_SCALE*pl.phi }));
}



// ---------- riconoscimenti di fine torneo ----------
// Solo meriti, mai "i peggiori". Si calcolano sulle partite dei turni (le extra non contano).
function tournamentBadges(a){
  const names = archiveIdNames(a), nm = x => (roster[x] && roster[x].name) || names[x] || x;
  const P = {};
  const get = id => P[id] || (P[id] = { w:0, l:0, upsets:0, tbWins:0 });
  let bestMargin = 0, marginWinners = [];
  (a.history || []).forEach(h => (h.matches || []).forEach(m => {
    const b = matchBaseIds(a, m), r = matchWinner(m.s1, m.s2, m.tb);
    (b.a || []).concat(b.b || []).forEach(get);
    if(r === 0.5 || !b.a || !b.b) return;
    const win = r === 1 ? b.a : b.b, lose = r === 1 ? b.b : b.a;
    const tbWin = m.s1 === m.s2 || (Math.max(m.s1, m.s2) === 7 && Math.abs(m.s1 - m.s2) === 1);
    win.forEach(id => { get(id).w++; if(isUpset(m)) get(id).upsets++; if(tbWin) get(id).tbWins++; });
    lose.forEach(id => get(id).l++);
    const diff = Math.abs(m.s1 - m.s2);
    if(diff > bestMargin){ bestMargin = diff; marginWinners = [win]; } else if(diff === bestMargin && diff > 0) marginWinners.push(win);
  }));
  const ids = Object.keys(P), badges = [];
  const top = (key, min) => { const mx = Math.max(0, ...ids.map(id => P[id][key])); return mx < min ? null : { ids: ids.filter(id => P[id][key] === mx), n: mx }; };
  const up = top('upsets', 1);
  if(up) badges.push({ icon:'⚡', title:'Sorpresa del torneo', ids:up.ids, note: up.n+(up.n === 1 ? ' vittoria' : ' vittorie')+' contro pronostico' });
  if(bestMargin >= 3) badges.push({ icon:'💥', title:'Macina-game', ids:[...new Set([].concat(...marginWinners))], note:'vittoria con '+bestMargin+' game di scarto' });
  const tbw = top('tbWins', 1);
  if(tbw) badges.push({ icon:'🧊', title:'Nervi saldi', ids:tbw.ids, note: tbw.n+(tbw.n === 1 ? ' tie-break vinto' : ' tie-break vinti') });
  const perfect = ids.filter(id => P[id].l === 0 && P[id].w >= 2);
  if(perfect.length && perfect.length < ids.length) badges.push({ icon:'✅', title:'Percorso netto', ids:perfect, note:'tutte vittorie' });
  const gains = (a.ratingChanges || []).filter(r => r.after - r.before > 0);
  if(gains.length){
    const mx = Math.max(...gains.map(r => r.after - r.before));
    badges.push({ icon:'📈', title:'Miglior rialzo', ids:gains.filter(r => mx - (r.after - r.before) < 0.05).map(r => r.id), note:'+'+(Math.round(mx*10)/10).toFixed(1)+' di rating' });
  }
  return badges.map(b => Object.assign(b, { who: b.ids.map(nm).sort((x, y) => x.localeCompare(y)).join(', ') }));
}
function badgesHtml(a){
  const b = tournamentBadges(a);
  if(!b.length) return '';
  return '<p class="section-label" style="margin-top:10px;">Riconoscimenti</p>' + b.map(x => recRow(x.icon+' '+x.title, x.who, '', x.note)).join('');
}
function badgesText(a){
  const b = tournamentBadges(a);
  return b.length ? '*Riconoscimenti*\n' + b.map(x => x.icon+' '+x.title+': '+x.who+' ('+x.note+')').join('\n') + '\n\n' : '';
}

// ---------- perché il rating è cambiato ----------
// Spiega la variazione di un giocatore in un torneo archiviato (ai = posizione nell'archivio).
// Elo: ogni partita muove di K x peso x (punteggio - attesa), quindi si elenca partita per partita e la somma torna.
// Glicko-2: il rating si aggiorna sull'intero torneo, quindi si mostrano attese, punti ottenuti e incertezza (RD).
function explainRating(id, ai, sys){
  const a = archive[ai];
  if(!a || !countsForRatings(a)) return null;
  const list = archive.filter(countsForRatings), pi = list.indexOf(a);
  const row = (a.ratingChanges || []).find(r => r.id === id);
  if(!row) return null;
  const names = archiveIdNames(a), nm = x => (roster[x] && roster[x].name) || names[x] || x;
  const nHist = (a.history || []).reduce((n, h) => n + (h.matches || []).length, 0);
  const avg = arr => arr.reduce((x, y) => x + y, 0) / arr.length;
  const out = { sys: sys === 'glicko' ? 'glicko' : 'elo', matches:[] };
  const flip = (e, inA) => ({ g: inA ? [e.s1, e.s2] : [e.s2, e.s1], tb: e.tb ? (inA ? e.tb : [e.tb[1], e.tb[0]]) : null });
  if(out.sys === 'elo'){
    computeEloStates(list.slice(0, pi+1), false, { onPeriod: (aa, entries, snap, idx) => {
      if(idx !== pi) return;
      const info = x => snap[x] || { elo:START_ELO, matches:0 };
      entries.forEach((e, k) => {
        const inA = e.idsA.includes(id), inB = e.idsB.includes(id);
        if((!inA && !inB) || !e.idsA.length || !e.idsB.length) return;
        const own = inA ? e.idsA : e.idsB, opp = inA ? e.idsB : e.idsA;
        const exp = 1/(1+Math.pow(10, (avg(opp.map(x => info(x).elo)) - avg(own.map(x => info(x).elo)))/400));
        const S0 = gameScore(e.s1, e.s2, e.tb), S = inA ? S0 : 1 - S0, kk = kFor(info(id).matches);
        out.k = kk;
        out.matches.push(Object.assign({ partner: own.filter(x => x !== id).map(nm).join(' & '), opp: opp.map(nm).join(' & '), exp, S, delta: kk*e.weight*(S-exp), weight:e.weight, extra: k >= nHist }, flip(e, inA)));
      });
    } });
    out.before = row.before; out.after = row.after; out.frozen = !!(roster[id] && roster[id].frozen);
    return out;
  }
  let k = 0;
  computeGlicko(list.slice(0, pi+1), (A, B, gm, idx) => {
    if(idx !== pi) return;
    const myK = k++;
    const inA = A.some(x => x.id === id), inB = B.some(x => x.id === id);
    if(!inA && !inB) return;
    const own = inA ? A : B, opp = inA ? B : A, pl = own.find(x => x.id === id);
    const varOf = t => t.reduce((x, y) => x + y.phi*y.phi, 0);
    const diff = avg(own.map(x => x.mu)) - avg(opp.map(x => x.mu));
    const phiOpp = Math.sqrt(varOf(opp)/(opp.length*opp.length) + (varOf(own) - pl.phi*pl.phi)/(own.length*own.length));
    const exp = g2E(pl.mu, pl.mu - diff, phiOpp);
    const S0 = gameScore(gm.s1, gm.s2, gm.tb), S = inA ? S0 : 1 - S0;
    out.matches.push(Object.assign({ partner: own.filter(x => x.id !== id).map(x => nm(x.id)).join(' & '), opp: opp.map(x => nm(x.id)).join(' & '), exp, S, weight:gm.weight, extra: myK >= nHist }, flip(gm, inA)));
  });
  const rowOf = l => computeGlicko(l).find(r => r.id === id);
  const post = rowOf(list.slice(0, pi+1)), pre = pi > 0 ? rowOf(list.slice(0, pi)) : null;
  if(!post) return null;
  out.after = post.rating; out.rd1 = post.rd;
  out.before = pre ? pre.rating : (roster[id] ? startState(id).elo : G2_BASE); out.rd0 = pre ? pre.rd : 350;
  out.got = out.matches.reduce((n, m) => n + m.weight*m.S, 0);
  out.expected = out.matches.reduce((n, m) => n + m.weight*m.exp, 0);
  return out;
}
function explainBodyHtml(ex){
  if(!ex) return '';
  const pct = x => Math.round(x*100)+'%', sg = x => (x > 0 ? '+' : '') + (Math.round(x*10)/10).toFixed(1);
  let h = '<div class="why-body">';
  if(ex.sys === 'glicko'){
    const diff = ex.got - ex.expected;
    h += '<p>Nel Glicko-2 il rating si aggiorna sull\'intero torneo, non partita per partita.</p>';
    h += '<p>Punti ottenuti: <b>'+ex.got.toFixed(1)+'</b> su <b>'+ex.expected.toFixed(1)+'</b> attesi &rarr; '+(diff > 0.05 ? 'più del previsto, il rating sale.' : (diff < -0.05 ? 'meno del previsto, il rating scende.' : 'in linea con le attese, il rating cambia poco.'))+'</p>';
    h += '<p>Incertezza (RD): '+Math.round(ex.rd0)+' &rarr; '+Math.round(ex.rd1)+'. Più è alta, più il rating si muove; scende man mano che giochi.</p>';
  } else {
    h += '<p>Ogni partita muove il rating di K &times; (punteggio &minus; attesa), con K = '+ex.k+'. L\'attesa è la probabilità prevista dai rating delle due coppie; il punteggio tiene conto di quanto hai vinto o perso.</p>';
    if(ex.frozen) h += '<p>Il tuo rating è congelato: resta un riferimento fisso e non cambia.</p>';
  }
  ex.matches.forEach(m => {
    const tb = m.tb ? ' (tb '+m.tb[0]+'-'+m.tb[1]+')' : '';
    const surprise = m.exp < 0.4 && m.S > 0.5 ? ' ⚡' : '';
    h += '<div class="history-match"><span>'+(m.extra ? 'extra · ' : '')+'con '+esc(m.partner)+' vs '+esc(m.opp)+' · '+m.g[0]+'&ndash;'+m.g[1]+tb+surprise+'</span><span>attesa '+pct(m.exp)+(ex.sys === 'elo' ? ' &rarr; '+sg(m.delta) : '')+'</span></div>';
  });
  if(ex.sys === 'elo' && ex.matches.length){
    const tot = ex.matches.reduce((n, m) => n + m.delta, 0);
    h += '<p style="margin-top:6px;">Totale: <b>'+sg(tot)+'</b>'+(ex.matches.some(m => m.weight < 1) ? ' (le partite extra pesano meno)' : '')+'</p>';
  }
  return h + '</div>';
}
function whyDetails(id, ai, sys){
  const b = explainBodyHtml(explainRating(id, ai, sys));
  return b ? '<details class="why"><summary>Perché?</summary>'+b+'</details>' : '';
}
function profileWhyHtml(id){
  const sys = rankMode === 'glicko' ? 'glicko' : 'elo', idxs = [];
  for(let i = archive.length-1; i >= 0 && idxs.length < 5; i--){
    if(countsForRatings(archive[i]) && (archive[i].ratingChanges || []).some(r => r.id === id)) idxs.push(i);
  }
  let h = '';
  idxs.forEach(i => {
    const ex = explainRating(id, i, sys); if(!ex) return;
    const d = Math.round((ex.after - ex.before)*10)/10;
    h += '<details class="why"><summary>'+itDate(dateKey(archive[i].date))+' · '+Math.round(ex.before)+' &rarr; '+Math.round(ex.after)+' ('+(d > 0 ? '+' : '')+d.toFixed(1)+')</summary>'+explainBodyHtml(ex)+'</details>';
  });
  return h ? '<p class="section-label" style="margin-top:14px;">Perché il rating è cambiato ('+(sys === 'glicko' ? 'Glicko-2' : 'Elo')+')</p>'+h : '';
}

// ---------- diagnostica: quanto i rating prevedono i risultati ----------

let showDiag = false;
function scoreWL(s1, s2, tb){ return matchWinner(s1, s2, tb); }

// Ogni partita (dal 2° torneo in poi, escluse le patte) è prevista con i rating di inizio torneo: p = probabilità che la coppia A vinca.
function eloPredictions(opts){
  const log = [];
  const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
  computeEloStates(archive, false, Object.assign({}, opts, { onPeriod: (a, entries, snap, pi) => {
    if(pi === 0) return;
    const info = id => snap[id] ? snap[id].elo : START_ELO;
    entries.forEach(e => {
      const res = matchWinner(e.s1, e.s2, e.tb);
      if(res === 0.5 || !e.idsA.length || !e.idsB.length) return;
      const rA = avg(e.idsA.map(info)), rB = avg(e.idsB.map(info));
      log.push({ p: 1/(1+Math.pow(10,(rB-rA)/400)), y: res });
    });
  }}));
  return log;
}
function glickoPredictions(opts){
  const log = [];
  computeGlicko(archive, (A, B, gm, pi) => {
    const res = matchWinner(gm.s1, gm.s2, gm.tb);
    if(pi === 0 || res === 0.5) return;
    const muA = A.reduce((x,y)=>x+y.mu,0)/A.length, muB = B.reduce((x,y)=>x+y.mu,0)/B.length;
    const v = (A.reduce((x,y)=>x+y.phi*y.phi,0) + B.reduce((x,y)=>x+y.phi*y.phi,0))/4;
    log.push({ p: 1/(1+Math.exp(-g2g(Math.sqrt(v))*(muA-muB))), y: res });
  }, opts);
  return log;
}
function predictionStats(log){
  let brier = 0, ll = 0, hit = 0, decisive = 0;
  log.forEach(r => {
    const pp = Math.min(0.999, Math.max(0.001, r.p));
    brier += Math.pow(pp - r.y, 2);
    ll += -(r.y*Math.log(pp) + (1-r.y)*Math.log(1-pp));
    if(Math.abs(r.p - 0.5) > 1e-9){ decisive++; if((r.p > 0.5) === (r.y === 1)) hit++; }
  });
  const n = log.length;
  return { n, decisive, acc: decisive ? hit/decisive : null, brier: n ? brier/n : null, ll: n ? ll/n : null };
}
function diagView(){
  // Tutte le varianti sono calcolate in modo esplicito: il confronto non cambia con la spunta "solo V/S" delle classifiche.
  const inUse = calc.winOnly ? 'solo V/S' : 'scarto di game';
  const variants = [
    ['Elo, scarto di game', eloPredictions({scoreFn:marginScore}), !calc.winOnly],
    ['Elo, scarto, K dimezzato', eloPredictions({scoreFn:marginScore, kScale:0.5})],
    ['Elo, scarto, K doppio', eloPredictions({scoreFn:marginScore, kScale:2})],
    ['Elo, solo V/S', eloPredictions({scoreFn:scoreWL}), !!calc.winOnly],
    ['Glicko-2, scarto di game', glickoPredictions({scoreFn:marginScore}), !calc.winOnly],
    ['Glicko-2, solo V/S', glickoPredictions({scoreFn:scoreWL}), !!calc.winOnly]
  ];
  const n = variants[0][1].length;
  const f3 = x => x === null ? '—' : x.toFixed(3).replace('.', ',');
  let html = '<section><p class="section-label">Diagnostica rating</p>';
  html += '<p class="hint">Ogni partita, dal 2° torneo in poi, viene prevista con i rating di inizio torneo. Vince il sistema che sbaglia meno. Brier e log-loss: più basso è meglio. Tirare a caso dà 0,250 e 0,693. Il confronto è sempre completo, qualunque sia la spunta "solo V/S"; i sistemi oggi in uso nelle classifiche (<b>'+inUse+'</b>) sono segnati con ●.</p>';
  if(n < 20){
    html += '<p class="roster-empty">Partite valutabili: '+n+'. Servono più tornei: con meno di circa 40 partite le differenze sono rumore.</p>';
  } else if(n < 40){
    html += '<p class="hint"><b>Partite valutabili: '+n+'.</b> Ancora poche: guarda le tendenze, non le differenze piccole.</p>';
  } else {
    html += '<p class="hint"><b>Partite valutabili: '+n+'.</b></p>';
  }
  html += '<table><tr><th>Sistema</th><th class="num">Favorito</th><th class="num">Brier</th><th class="num">Log-loss</th></tr>';
  html += '<tr><td>Tirare a caso</td><td class="num">50%</td><td class="num">0,250</td><td class="num">0,693</td></tr>';
  variants.forEach(([label, log, used]) => {
    const st = predictionStats(log);
    html += '<tr><td>'+label+(used ? ' ●' : '')+'</td><td class="num">'+(st.acc === null ? '—' : Math.round(st.acc*100)+'%')+'</td><td class="num">'+f3(st.brier)+'</td><td class="num">'+f3(st.ll)+'</td></tr>';
  });
  html += '</table>';
  // calibrazione dell'Elo in uso: quando dice "70% per il favorito", il favorito vince davvero il 70%?
  const cal = variants[calc.winOnly ? 3 : 0][1].filter(r => Math.abs(r.p-0.5) > 1e-9).map(r => r.p >= 0.5 ? { p:r.p, y:r.y } : { p:1-r.p, y:1-r.y });
  const bins = [[0.5,0.6],[0.6,0.7],[0.7,0.8],[0.8,1.01]];
  html += '<p class="section-label" style="margin-top:16px;">Calibrazione dell\'Elo in uso ('+inUse+')</p>';
  html += '<table><tr><th>Previsione favorito</th><th class="num">Partite</th><th class="num">Previsto</th><th class="num">Reale</th></tr>';
  bins.forEach(([lo, hi]) => {
    const rows = cal.filter(r => r.p >= lo && r.p < hi);
    const label = Math.round(lo*100)+'–'+Math.min(100, Math.round(hi*100))+'%';
    if(rows.length === 0){ html += '<tr><td>'+label+'</td><td class="num">0</td><td class="num">—</td><td class="num">—</td></tr>'; return; }
    const pm = rows.reduce((x,y)=>x+y.p,0)/rows.length, ym = rows.reduce((x,y)=>x+y.y,0)/rows.length;
    html += '<tr><td>'+label+'</td><td class="num">'+rows.length+'</td><td class="num">'+Math.round(pm*100)+'%</td><td class="num">'+Math.round(ym*100)+'%</td></tr>';
  });
  html += '</table>';

  html += '<button class="ghost back-active" onclick="showDiag=false;showRanking=true;render();">Torna alla classifica</button>';

function fmtWins(w){ return Number.isInteger(w) ? String(w) : w.toFixed(1); }


// ---------- Condivisione turno (WhatsApp / condivisione nativa) ----------
// Formato pensato per il telefono: i risultati e gli abbinamenti sono righe di testo normale che WhatsApp
// manda a capo da sé; solo le classifiche numeriche usano il blocco monospace, con righe di ~30 caratteri.
function matchNamesForShare(m){
  if(t.mode && t.mode !== 'fixed') return { a: m.aName, b: m.bName };
  const teamA = t.teams.find(x => x.id === m[0]), teamB = t.teams.find(x => x.id === m[1]);
  return { a: teamA ? teamA.name : '?', b: teamB ? teamB.name : '?' };
}

function padR(str, n){
  str = String(str);
  return str.length >= n ? str : str + ' '.repeat(n - str.length);
}
function padL(str, n){
  str = String(str);
  return str.length >= n ? str : ' '.repeat(n - str.length) + str;
}
function cutStr(str, n){
  str = String(str);
  return str.length <= n ? str : str.slice(0, n - 1) + '…';
}
// Blocco monospace WhatsApp (allineamento colonne più affidabile dei soli tab)
function monoBlock(lines){
  return '```\n' + lines.filter(Boolean).join('\n') + '\n```\n';
}
function scoreText(m){ return m.s1 + '-' + m.s2 + (m.tb ? ' (tb ' + m.tb[0] + '-' + m.tb[1] + ')' : ''); }

function shareText(text, title){

  } else if(navigator.clipboard && navigator.clipboard.writeText){

function fmtDateIT(iso){

function restingNamesForShare(){

function eloChangesBlock(changes, limit){
  const lines = [padR('Giocatore', 12) + padL('Prima', 6) + '|' + padL('Dopo', 5) + '|' + padL('Δ', 6)];
  const sorted = [...changes].sort((x,y)=>(y.after-y.before)-(x.after-x.before));
  (limit ? sorted.slice(0, limit) : sorted).forEach(r => {
    const d = Math.round((r.after - r.before) * 10) / 10;
    if(Math.abs(d) < 0.05) return;
    lines.push(padR(cutStr(r.name, 11), 12) + padL(Math.round(r.before), 6) + '|' + padL(Math.round(r.after), 5) + '|' + padL((d > 0 ? '+' : '') + d, 6));
  });
  if(limit && sorted.length > limit) lines.push('… +' + (sorted.length - limit) + ' altri');

}
function formatArchiveResults(a){

    (h.matches || []).forEach(m => { anyUpset = anyUpset || isUpset(m); const sn = matchSideNames(a, m); text += '• ' + sn[0] + ' – ' + sn[1] + ' → *' + scoreText(m) + '*' + (isUpset(m) ? ' ⚡' : '') + '\n'; });

  }

  if(a.mode && a.mode !== 'fixed'){
    const st = {};
    (a.history || []).forEach(h => (h.matches || []).forEach(m => {
      const add = (ids, sW, sL, win) => (ids || []).forEach(id => {
        if(!st[id]) st[id] = { id, wins:0, gW:0, gL:0 };
        st[id].gW += sW; st[id].gL += sL; st[id].wins += win;
      });
      const res = matchWinner(m.s1, m.s2, m.tb);
      const wA = res === 1 ? 1 : (res === 0.5 ? 0.5 : 0);
      const wB = res === 0 ? 1 : (res === 0.5 ? 0.5 : 0);
      add(m.pa, m.s1, m.s2, wA);
      add(m.pb, m.s2, m.s1, wB);

    })).sort((x,y) => y.wins - x.wins || (y.gW-y.gL) - (x.gW-x.gL) || y.gW - x.gW);
    if(rows.length){
      text += '*Classifica serata*\n';
      const lines = [padR('#', 4) + padR('Giocatore', 12) + padL('V', 4) + '|' + padL('Game', 7)];
      rows.forEach((r,i) => {
        lines.push(padR(String(i+1)+'.', 4) + padR(cutStr(r.name, 11), 12) + padL(fmtWins(r.wins), 4) + '|' + padL(r.gW + '-' + r.gL, 7));
      });
      text += monoBlock(lines) + '\n';
    }
  } else if(a.teams && a.teams.length){
    const teams = (a.teams || []).map((tm, idx) => {
      let wins = 0, setsWon = 0, setsLost = 0;
      (a.history || []).forEach(h => (h.matches || []).forEach(m => {
        const isA = (m.aId === tm.id) || (m.aId === idx) || (m.a === tm.name);
        const isB = (m.bId === tm.id) || (m.bId === idx) || (m.b === tm.name);
        if(isA){ setsWon += m.s1; setsLost += m.s2; const res = matchWinner(m.s1,m.s2,m.tb); if(res===1) wins++; else if(res===0.5) wins += 0.5; }
        if(isB){ setsWon += m.s2; setsLost += m.s1; const res = matchWinner(m.s1,m.s2,m.tb); if(res===0) wins++; else if(res===0.5) wins += 0.5; }
      }));
      return { name: tm.name, wins, setsWon, setsLost };
    }).filter(x => x.name).sort((x,y) => y.wins - x.wins || (y.setsWon-y.setsLost) - (x.setsWon-x.setsLost));
    if(teams.some(x => x.wins || x.setsWon || x.setsLost)){
      text += '*Classifica squadre*\n';
      teams.forEach((r,i) => {
        text += (i+1) + '. ' + r.name + ' — ' + fmtWins(r.wins) + ' V (game ' + r.setsWon + '-' + r.setsLost + ')\n';
      });
      text += '\n';
    }
  }

  text += badgesText(a);
  if(a.ratingChanges && a.ratingChanges.length){
    text += '*Variazioni Elo*\n' + eloChangesBlock(a.ratingChanges, 15) + '\n';
  }
  return text.trim();
}
