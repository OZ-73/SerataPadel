  }
  html += '</section>';
  return html;
}

// ---------- partite extra ----------

// ---------- Americano / Messicano: compagni variabili, punteggio individuale ----------
// I turni non sono persistiti come "squadre": ogni partita salva direttamente le coppie di id
// (m.pa/m.pb), quindi non serve nessuna struttura extra per annullare, correggere o chiudere il torneo.

function pk2(a, b){ return [a,b].sort().join('|'); }

// Statistiche individuali di QUESTO torneo, ricavate dai turni già giocati (mai salvate a parte).
function liveIndividualStats(){
  const st = {};
  (t.players || []).forEach(id => { st[id] = { matches:0, wins:0, gW:0, gL:0 }; });
  (t.history || []).forEach(h => h.matches.forEach(m => {
    const win = matchWinner(m.s1, m.s2, m.tb);
    (m.pa || []).forEach(id => { if(st[id]){ st[id].matches++; st[id].gW += m.s1; st[id].gL += m.s2; if(win===1) st[id].wins++; } });
    (m.pb || []).forEach(id => { if(st[id]){ st[id].matches++; st[id].gW += m.s2; st[id].gL += m.s1; if(win===0) st[id].wins++; } });
  }));
  return st;
}

// Chi ha già giocato con/contro chi in questo torneo, per evitare ripetizioni nei turni successivi.
function rotatingHistoryKeys(){
  const partners = new Set(), opponents = new Set();
  (t.history || []).forEach(h => h.matches.forEach(m => {
    partners.add(pk2(m.pa[0], m.pa[1]));
    partners.add(pk2(m.pb[0], m.pb[1]));
    m.pa.forEach(x => m.pb.forEach(y => opponents.add(pk2(x,y))));
  }));
  return { partners, opponents };
}

// Forza di riferimento per il primo turno (prima che ci siano risultati): Elo o Glicko-2, come per i suggerimenti.
function rotatingStrengthFn(){
  const gm = strengthMap();
  const byId = roster;  // la chiave della rubrica È l'id
  return id => gm ? (gm[id] !== undefined ? gm[id] : START_ELO) : (byId[id] ? byId[id].elo : START_ELO);
}

// Messicano: si riordina a ogni turno in base alla classifica di questa serata (a parità, alla forza di partenza),
// si raggruppa a blocchi di 4 nell'ordine, e in ogni blocco si abbina 1°+4° contro 2°+3°, evitando una coppia già giocata insieme.
function messicanoGroups(playing, matchesCount){
  const st = liveIndividualStats(), strOf = rotatingStrengthFn();
  const { partners } = rotatingHistoryKeys();
  const sorted = [...playing].sort((a,b) => {
    const sa = st[a], sb = st[b];
    return (sb.wins - sa.wins) || ((sb.gW-sb.gL) - (sa.gW-sa.gL)) || (sb.gW - sa.gW) || (strOf(b) - strOf(a));
  });
  const groups = [];
  for(let i = 0; i < matchesCount; i++){
    const g = sorted.slice(i*4, i*4+4);
    const options = [[[0,3],[1,2]], [[0,2],[1,3]], [[0,1],[2,3]]];
    let chosen = null;
    for(const [ia, ib] of options){
      const pa = [g[ia[0]], g[ia[1]]], pb = [g[ib[0]], g[ib[1]]];
      if(!partners.has(pk2(pa[0],pa[1])) && !partners.has(pk2(pb[0],pb[1]))){ chosen = [pa,pb]; break; }
    }
    if(!chosen){ chosen = [[g[0],g[3]],[g[1],g[2]]]; }
    groups.push(chosen);
  }
  return groups;
}

// Americano: si mescola tutto il gruppo e si formano squadre di 2 cercando di non ripetere compagni o avversari
// e di tenere le due coppie di un campo equilibrate per forza. Si provano più mescolate a caso e si tiene la migliore.
function americanoGroups(playing, matchesCount){
  const strOf = rotatingStrengthFn();
  const { partners, opponents } = rotatingHistoryKeys();
  const pairingsOf4 = [[[0,1],[2,3]], [[0,2],[1,3]], [[0,3],[1,2]]];
  let best = null, bestCost = Infinity;
  for(let attempt = 0; attempt < 300; attempt++){
    const pool = shuffle(playing);
    const groups = [];
    let cost = 0;
    for(let i = 0; i < matchesCount; i++){
      const g = pool.slice(i*4, i*4+4);
      let gBest = null, gCost = Infinity;
      pairingsOf4.forEach(([ia, ib]) => {
        const pa = [g[ia[0]], g[ia[1]]], pb = [g[ib[0]], g[ib[1]]];
        let c = 0;
        if(partners.has(pk2(pa[0],pa[1]))) c += 1000;
        if(partners.has(pk2(pb[0],pb[1]))) c += 1000;
        pa.forEach(x => pb.forEach(y => { if(opponents.has(pk2(x,y))) c += 10; }));
        c += Math.abs((strOf(pa[0])+strOf(pa[1])) - (strOf(pb[0])+strOf(pb[1]))) / 50;
        if(c < gCost){ gCost = c; gBest = [pa,pb]; }
      });
      groups.push(gBest);
      cost += gCost;
    }
    if(cost < bestCost){ bestCost = cost; best = groups; }
  }
  return best;
}

function generateRotatingRound(){
  t.round++;
  const pool = t.players.slice();
  const matchesCount = Math.min(t.courts, Math.floor(pool.length/4));
  const restingCount = pool.length - matchesCount*4;
  let restIds = [];
  if(restingCount > 0){
    const byRest = shuffle(pool).sort((a,b) => (t.restCounts[a]||0) - (t.restCounts[b]||0));
    restIds = byRest.slice(0, restingCount);
    restIds.forEach(id => { t.restCounts[id] = (t.restCounts[id]||0) + 1; });
  }
  const playing = pool.filter(id => !restIds.includes(id));
  const groups = (t.mode === 'messicano') ? messicanoGroups(playing, matchesCount) : americanoGroups(playing, matchesCount);
  t.currentMatches = groups.map(([pa,pb], court) => ({ pa, pb, aName: pa.map(playerName).join(' & '), bName: pb.map(playerName).join(' & '), court }));
  t.restingThisRound = restIds;
  roundDraft = {};
  pairEdit = null;
  saveTournament();
  render();
}

function submitRotatingResults(){
  let valid = true;
  t.currentMatches.forEach((m,idx) => {
    const s1raw = document.getElementById('s1_'+idx).value, s2raw = document.getElementById('s2_'+idx).value;
    if(s1raw==='' || s2raw===''){ valid = false; return; }
    const s1 = Number(s1raw), s2 = Number(s2raw);
    if(!scoreIsPlausible(s1, s2)){ valid = false; return; }
    if(isTiedSix(s1, s2)){
      const tb1raw = document.getElementById('tb1_'+idx).value, tb2raw = document.getElementById('tb2_'+idx).value;
      if(tb1raw===''||tb2raw===''||!tiebreakIsPlausible(Number(tb1raw), Number(tb2raw))){ valid = false; }
    }
  });
  if(!valid){ document.getElementById('err').textContent = 'Controlla i punteggi: sopra il 6 lo scarto può essere al massimo di 2 game; sul 6-6 inserisci anche il tie-break (chi arriva a 7 con almeno 2 di scarto).'; return; }
  const roundResults = t.currentMatches.map((m,idx) => {
    const s1 = parseInt(document.getElementById('s1_'+idx).value), s2 = parseInt(document.getElementById('s2_'+idx).value);
    const tb = isTiedSix(s1, s2) ? [parseInt(document.getElementById('tb1_'+idx).value), parseInt(document.getElementById('tb2_'+idx).value)] : undefined;
    const gmP = strengthMap();
    const av = teamStrengthIds(m.pa, gmP), bv = teamStrengthIds(m.pb, gmP);
    const rec = { pa:m.pa, pb:m.pb, a: m.aName, b: m.bName, s1, s2, tb, court: idx };
    if(av !== null && bv !== null) rec.pA = Math.round(winProb(av, bv) * 1000) / 1000;
    return rec;
  });
  t.history.push({ round:t.round, resting:(t.restingThisRound||[]), matches:roundResults });
  t.currentMatches = [];
  roundDraft = {};
  pairEdit = null;
  saveTournament();
  render();
}

function undoRotatingRound(){
  if(t.history.length === 0) return;
  const last = t.history.pop();
  t.currentMatches = last.matches.map(m => ({ pa:m.pa, pb:m.pb, aName:m.a, bName:m.b, court:m.court }));
  (last.resting || []).forEach(id => { if(t.restCounts[id] > 0) t.restCounts[id]--; });
  t.restingThisRound = last.resting || [];
  roundDraft = {};
  pairEdit = null;
  saveTournament();
  render();
}

function startRotatingTournament(){
  const players = Array.from(selected).filter(k => roster[k]);
  if(!t.courts || t.courts < 1){ document.getElementById('setupErr').textContent = 'Indica quanti campi avete.'; return; }
  if(!t.maxRounds || t.maxRounds < 1){ document.getElementById('setupErr').textContent = 'Indica quanti turni volete giocare.'; return; }
  if(players.length < 4){ document.getElementById('setupErr').textContent = 'Servono almeno 4 giocatori.'; return; }
  document.getElementById('setupErr').textContent = '';

  const mode = pendingMode, courts = t.courts, maxRounds = t.maxRounds, unofficial = !!t.unofficial;
  t = { phase:'playing', mode, courts, maxRounds, unofficial, players, round:0, currentMatches:[], history:[], restCounts:{}, extras:[] };
  players.forEach(id => { t.restCounts[id] = 0; });
  roundDraft = {};
  pairEdit = null;
  saveTournament();
  pendingMode = 'fixed';
  render();
}

function extraPlayers(){
  const names = [];
  if(t.mode && t.mode !== 'fixed'){
    t.players.forEach(id => { const nm = playerName(id); if(!names.includes(nm)) names.push(nm); });
  } else {
    t.teams.forEach(tm => tm.players.forEach(p => { if(!names.includes(p)) names.push(p); }));
  }
  return names.sort((a,b)=> a.localeCompare(b));
}
function openExtraForm(){ extraDraft = { a1:'', a2:'', b1:'', b2:'', s1:'', s2:'', tb1:'', tb2:'', rating:'reduced' }; render(); }
function closeExtraForm(){ extraDraft = null; render(); }
function setExtraField(field, val){
  const d = extraDraft, oldVal = d[field];
  if(val !== ''){
    ['a1','a2','b1','b2'].forEach(f => { if(f !== field && d[f] === val){ d[f] = oldVal; } });
  }
  d[field] = val;
  render();
}

function saveExtra(){
  const d = extraDraft;
  const err = document.getElementById('extraErr');
  const names = [d.a1, d.a2, d.b1, d.b2];
  if(names.some(n => !n)){ err.textContent = 'Scegli tutti e quattro i giocatori.'; return; }
  if(new Set(names).size !== 4){ err.textContent = 'Ogni giocatore può comparire una sola volta.'; return; }
  const s1 = Number(d.s1), s2 = Number(d.s2);
  const isInt = Number.isInteger(s1) && Number.isInteger(s2) && s1>=0 && s2>=0;
  if(d.s1==='' || d.s2==='' || !isInt || s1+s2===0){
    err.textContent = 'Inserisci un punteggio con numeri interi (va bene anche una partita interrotta).'; return;
  }
  if(!scoreIsPlausible(s1, s2)){
    err.textContent = 'Sopra il 6 lo scarto può essere al massimo di 2 game: la partita sarebbe già finita.'; return;
  }
  let tb;
  if(isTiedSix(s1, s2)){
    const tb1 = Number(d.tb1), tb2 = Number(d.tb2);
    if(d.tb1==='' || d.tb2==='' || !tiebreakIsPlausible(tb1, tb2)){
      err.textContent = 'Sul 6-6 inserisci il punteggio del tie-break (chi arriva a 7 con almeno 2 di scarto).'; return;
    }
    tb = [tb1, tb2];
  }
  const rating = t.unofficial ? 'none' : d.rating;
  // Il peso viene salvato come numero: l'archivio resta ricalcolabile anche se in futuro cambiano le costanti.
  const weight = rating==='full' ? 1 : (rating==='reduced' ? EXTRA_K_FACTOR : 0);
  t.extras.push({ id: Date.now(), teamA:[d.a1,d.a2], teamB:[d.b1,d.b2], s1, s2, tb, rating, weight });
  extraDraft = null;
  saveTournament();
  render();
}

    .map(id => { const p = roster[id]; return { id, name:p.name, elo: st[id] ? st[id].elo : p.elo0, matches: st[id] ? st[id].matches : (p.matches0||0), frozen:!!p.frozen }; })
    .filter(r => r.matches > 0 && !r.frozen)

  }).filter(r => r.matches >= MIN_MATCHES_WINRATE && !r.frozen).sort((a,b)=> b.wr-a.wr || b.matches-a.matches || a.name.localeCompare(b.name));
  const ranks = computeRanks(rows, r => Math.round(r.wr*100));

  const rows = teamStats(list, false).filter(x=>x.matches>0).sort((a,b)=>{
    const wa = a.wins/a.matches, wb = b.wins/b.matches;

function arrow(mv, key){
  if(!mv.prev || mv.cur[key] === undefined) return '<span class="delta same">&ndash;</span>';
  return deltaTag(mv.prev[key], mv.cur[key]);

function deltaTag(prevRank, currentIdx){
  if(prevRank === undefined) return '<span class="delta new">nuovo</span>';

}

// ---------- Glicko-2 (calcolato dall'archivio: ogni torneo chiuso è un periodo di valutazione) ----------

const G2_SCALE = 173.7178, G2_TAU = 0.5, G2_INIT_SIGMA = 0.06, G2_INIT_PHI = 350/173.7178;
const G2_BASE = START_ELO;   // scala centrata come l'Elo dell'app, così i numeri sono confrontabili

function g2g(phi){ return 1/Math.sqrt(1+3*phi*phi/(Math.PI*Math.PI)); }
function g2E(mu, muJ, phiJ){ return 1/(1+Math.exp(-g2g(phiJ)*(mu-muJ))); }

// pl: {mu, phi, sigma} — games: [{mu, phi, s, w}] (w = peso della partita, 1 = piena)
function g2Update(pl, games){
  const cap = 350/G2_SCALE;
  if(games.length === 0){
    return { mu:pl.mu, phi:Math.min(cap, Math.sqrt(pl.phi*pl.phi + pl.sigma*pl.sigma)), sigma:pl.sigma };
  }
  let vInv = 0, dSum = 0;
  games.forEach(gm => {
    const g = g2g(gm.phi), E = g2E(pl.mu, gm.mu, gm.phi);
    vInv += gm.w*g*g*E*(1-E);
    dSum += gm.w*g*(gm.s-E);
  });
  const v = 1/vInv, delta = v*dSum;
  const a = Math.log(pl.sigma*pl.sigma), tau2 = G2_TAU*G2_TAU, phi2 = pl.phi*pl.phi;
  const f = x => { const ex = Math.exp(x); return ex*(delta*delta-phi2-v-ex)/(2*Math.pow(phi2+v+ex,2)) - (x-a)/tau2; };
  let A = a, B;
  if(delta*delta > phi2+v){ B = Math.log(delta*delta-phi2-v); }
  else { let k = 1; while(f(a-k*G2_TAU) < 0 && k < 100) k++; B = a-k*G2_TAU; }
  let fA = f(A), fB = f(B), iter = 0;
  while(Math.abs(B-A) > 1e-6 && iter++ < 100){
    const C = A + (A-B)*fA/(fB-fA), fC = f(C);
    if(fC*fB < 0){ A = B; fA = fB; } else { fA = fA/2; }
    B = C; fB = fC;
  }
  const sigmaNew = Math.exp(A/2);
  const phiStar = Math.sqrt(phi2 + sigmaNew*sigmaNew);
  const phiNew = 1/Math.sqrt(1/(phiStar*phiStar) + 1/v);
  return { mu: pl.mu + phiNew*phiNew*dSum, phi: Math.min(cap, phiNew), sigma: sigmaNew };
}

function computeGlicko(list, hook){
  list = (list || archive).filter(a => !a.excluded);
  const byId = roster;  // la chiave della rubrica È l'id
  const P = {};
  const get = id => {
    if(!P[id]){
      const base = (byId[id] && byId[id].elo0 !== undefined) ? byId[id].elo0 : G2_BASE;  // parte dallo stesso rating iniziale impostato per l'Elo (utile per gli ospiti "congelati")
      P[id] = { id, mu:(base - G2_BASE)/G2_SCALE, phi:G2_INIT_PHI, sigma:G2_INIT_SIGMA, games:0, seen:false };
    }
    return P[id];
  };
  list.forEach((a, pi) => {
    const gamesOf = {};
    archiveGames(a).forEach(gm => {
      const A = gm.idsA.map(get), B = gm.idsB.map(get);
      if(A.length === 0 || B.length === 0) return;
      if(hook) hook(A, B, gm, pi);
      const S = gameScore(gm.s1, gm.s2, gm.tb);
      const muA = A.reduce((x,y)=>x+y.mu,0)/A.length, muB = B.reduce((x,y)=>x+y.mu,0)/B.length;
      const varOf = team => team.reduce((x,y)=>x+y.phi*y.phi,0);
      function addFor(own, opp, diff, sc){
        own.forEach(pl => {
          // L'avversario "equivalente" tiene conto del compagno: la differenza di forza è quella tra le due coppie.
          const partnersVar = varOf(own) - pl.phi*pl.phi;
          const phiOpp = Math.sqrt(varOf(opp)/(opp.length*opp.length) + partnersVar/(own.length*own.length));
          (gamesOf[pl.id] = gamesOf[pl.id] || []).push({ mu: pl.mu - diff, phi: phiOpp, s: sc, w: gm.weight });
        });
      }
      addFor(A, B, muA-muB, S);
      addFor(B, A, muB-muA, 1-S);
      A.concat(B).forEach(pl => { pl.seen = true; pl.games++; });
    });
    // Tutti i giocatori già visti si aggiornano insieme, a partire dallo stato di inizio periodo.
    const next = {};
    Object.values(P).forEach(pl => { if(pl.seen && !(byId[pl.id] && byId[pl.id].frozen)) next[pl.id] = g2Update(pl, gamesOf[pl.id] || []); });
    Object.keys(next).forEach(id => Object.assign(P[id], next[id]));
  });
  return Object.values(P)
    .filter(pl => pl.games > 0 && byId[pl.id] && !byId[pl.id].hidden)
    .map(pl => ({ id:pl.id, name:byId[pl.id].name, games:pl.games, rating: G2_BASE + G2_SCALE*pl.mu, rd: G2_SCALE*pl.phi }));
}

// ---------- diagnostica: quanto i rating prevedono i risultati ----------

let showDiag = false;
function scoreWL(s1, s2, tb){ return matchWinner(s1, s2, tb); }

// Ogni partita (dal 2° torneo in poi, escluse le patte) è prevista con i rating di inizio torneo: p = probabilità che la coppia A vinca.
function eloPredictions(opts){
  const log = [];
  const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
  computeEloStates(archive, false, Object.assign({}, opts, { onPeriod: (a, entries, snap, pi) => {
    if(pi === 0) return;
    const info = id => snap[id] ? snap[id].elo : START_ELO;
    entries.forEach(e => {
      const res = matchWinner(e.s1, e.s2, e.tb);
      if(res === 0.5 || !e.idsA.length || !e.idsB.length) return;
      const rA = avg(e.idsA.map(info)), rB = avg(e.idsB.map(info));
      log.push({ p: 1/(1+Math.pow(10,(rB-rA)/400)), y: res });
    });
  }}));
  return log;
}
function glickoPredictions(){
  const log = [];
  computeGlicko(archive, (A, B, gm, pi) => {
    const res = matchWinner(gm.s1, gm.s2, gm.tb);
    if(pi === 0 || res === 0.5) return;
    const muA = A.reduce((x,y)=>x+y.mu,0)/A.length, muB = B.reduce((x,y)=>x+y.mu,0)/B.length;
    const v = (A.reduce((x,y)=>x+y.phi*y.phi,0) + B.reduce((x,y)=>x+y.phi*y.phi,0))/4;
    log.push({ p: 1/(1+Math.exp(-g2g(Math.sqrt(v))*(muA-muB))), y: res });
  });
  return log;
}
function predictionStats(log){
  let brier = 0, ll = 0, hit = 0, decisive = 0;
  log.forEach(r => {
    const pp = Math.min(0.999, Math.max(0.001, r.p));
    brier += Math.pow(pp - r.y, 2);
    ll += -(r.y*Math.log(pp) + (1-r.y)*Math.log(1-pp));
    if(Math.abs(r.p - 0.5) > 1e-9){ decisive++; if((r.p > 0.5) === (r.y === 1)) hit++; }
  });
  const n = log.length;
  return { n, decisive, acc: decisive ? hit/decisive : null, brier: n ? brier/n : null, ll: n ? ll/n : null };
}
function diagView(){
  const variants = [
    ['Elo attuale', eloPredictions({})],
    ['Elo, K dimezzato', eloPredictions({kScale:0.5})],
    ['Elo, K doppio', eloPredictions({kScale:2})],
    ['Elo, solo V/S', eloPredictions({scoreFn:scoreWL})],
    ['Glicko-2', glickoPredictions()]
  ];
  const n = variants[0][1].length;
  const f3 = x => x === null ? '—' : x.toFixed(3).replace('.', ',');
  let html = '<section><p class="section-label">Diagnostica rating</p>';
  html += '<p class="hint">Ogni partita, dal 2° torneo in poi, viene prevista con i rating di inizio torneo. Vince il sistema che sbaglia meno. Brier e log-loss: più basso è meglio. Tirare a caso dà 0,250 e 0,693.</p>';
  if(n < 20){
    html += '<p class="roster-empty">Partite valutabili: '+n+'. Servono più tornei: con meno di circa 40 partite le differenze sono rumore.</p>';
  } else if(n < 40){
    html += '<p class="hint"><b>Partite valutabili: '+n+'.</b> Ancora poche: guarda le tendenze, non le differenze piccole.</p>';
  } else {
    html += '<p class="hint"><b>Partite valutabili: '+n+'.</b></p>';
  }
  html += '<table><tr><th>Sistema</th><th class="num">Favorito</th><th class="num">Brier</th><th class="num">Log-loss</th></tr>';
  html += '<tr><td>Tirare a caso</td><td class="num">50%</td><td class="num">0,250</td><td class="num">0,693</td></tr>';
  variants.forEach(([label, log]) => {
    const st = predictionStats(log);
    html += '<tr><td>'+label+'</td><td class="num">'+(st.acc === null ? '—' : Math.round(st.acc*100)+'%')+'</td><td class="num">'+f3(st.brier)+'</td><td class="num">'+f3(st.ll)+'</td></tr>';
  });
  html += '</table>';
  // calibrazione dell'Elo attuale: quando dice "70% per il favorito", il favorito vince davvero il 70%?
  const cal = variants[0][1].filter(r => Math.abs(r.p-0.5) > 1e-9).map(r => r.p >= 0.5 ? { p:r.p, y:r.y } : { p:1-r.p, y:1-r.y });
  const bins = [[0.5,0.6],[0.6,0.7],[0.7,0.8],[0.8,1.01]];
  html += '<p class="section-label" style="margin-top:16px;">Calibrazione dell\'Elo attuale</p>';
  html += '<table><tr><th>Previsione favorito</th><th class="num">Partite</th><th class="num">Previsto</th><th class="num">Reale</th></tr>';
  bins.forEach(([lo, hi]) => {
    const rows = cal.filter(r => r.p >= lo && r.p < hi);
    const label = Math.round(lo*100)+'–'+Math.min(100, Math.round(hi*100))+'%';
    if(rows.length === 0){ html += '<tr><td>'+label+'</td><td class="num">0</td><td class="num">—</td><td class="num">—</td></tr>'; return; }
    const pm = rows.reduce((x,y)=>x+y.p,0)/rows.length, ym = rows.reduce((x,y)=>x+y.y,0)/rows.length;
    html += '<tr><td>'+label+'</td><td class="num">'+rows.length+'</td><td class="num">'+Math.round(pm*100)+'%</td><td class="num">'+Math.round(ym*100)+'%</td></tr>';
  });
  html += '</table>';
  html += '<p class="hint" style="margin-top:8px;">Se il "reale" è molto sotto il "previsto", i rating sono troppo estremi (K troppo alto o punteggio troppo generoso). Se è sopra, sono troppo prudenti.</p>';
  html += '<button class="ghost back-active" onclick="showDiag=false;showRanking=true;render();">Torna alla classifica</button>';
  html += '</section>';
  return html;
}

function fmtWins(w){ return Number.isInteger(w) ? String(w) : w.toFixed(1); }


// ---------- Condivisione turno (WhatsApp / condivisione nativa) ----------
// Formato pensato per il telefono: i risultati e gli abbinamenti sono righe di testo normale che WhatsApp
// manda a capo da sé; solo le classifiche numeriche usano il blocco monospace, con righe di ~30 caratteri.
function matchNamesForShare(m){
  if(t.mode && t.mode !== 'fixed') return { a: m.aName, b: m.bName };
  const teamA = t.teams.find(x => x.id === m[0]), teamB = t.teams.find(x => x.id === m[1]);
  return { a: teamA ? teamA.name : '?', b: teamB ? teamB.name : '?' };
}

function padR(str, n){
  str = String(str);
  return str.length >= n ? str : str + ' '.repeat(n - str.length);
}
function padL(str, n){
  str = String(str);
  return str.length >= n ? str : ' '.repeat(n - str.length) + str;
}
function cutStr(str, n){
  str = String(str);
  return str.length <= n ? str : str.slice(0, n - 1) + '…';
}
// Blocco monospace WhatsApp (allineamento colonne più affidabile dei soli tab)
function monoBlock(lines){
  return '```\n' + lines.filter(Boolean).join('\n') + '\n```\n';
}
function scoreText(m){ return m.s1 + '-' + m.s2 + (m.tb ? ' (tb ' + m.tb[0] + '-' + m.tb[1] + ')' : ''); }

function shareText(text, title){
  title = title || 'Torneo Padel';
  if(navigator.share){
    navigator.share({ title: title, text: text }).catch(() => {});
  } else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => { dataMsg = 'Testo copiato negli appunti: incollalo su WhatsApp.'; render(); }).catch(() => { prompt('Copia il testo:', text); });
  } else {
    prompt('Copia il testo:', text);
  }
}
function fmtDateIT(iso){
  try{
    const d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    return d.toLocaleDateString('it-IT', { day:'numeric', month:'short', year:'numeric' });
  }catch(e){ return ''; }
}
function restingNamesForShare(){
  if(!t.restingThisRound || !t.restingThisRound.length) return '';
  return (t.mode && t.mode !== 'fixed')
    ? t.restingThisRound.map(playerName).join(', ')
    : t.restingThisRound.map(id => { const tm = t.teams.find(x => x.id === id); return tm ? tm.name : id; }).join(', ');

function eloChangesBlock(changes, limit){
  const lines = [padR('Giocatore', 12) + padL('Prima', 6) + padL('Dopo', 6) + padL('Δ', 7)];
  const sorted = [...changes].sort((x,y)=>(y.after-y.before)-(x.after-x.before));
  (limit ? sorted.slice(0, limit) : sorted).forEach(r => {
    const d = Math.round((r.after - r.before) * 10) / 10;
    if(Math.abs(d) < 0.05) return;
    lines.push(padR(cutStr(r.name, 11), 12) + padL(Math.round(r.before), 6) + padL(Math.round(r.after), 6) + padL((d > 0 ? '+' : '') + d, 7));
  });
  if(limit && sorted.length > limit) lines.push('… +' + (sorted.length - limit) + ' altri');
  return monoBlock(lines);
}
function formatArchiveResults(a){
  const mode = a.mode === 'messicano' ? 'Messicano' : (a.mode === 'americano' ? 'Americano' : 'Squadre fisse');
  const when = fmtDateIT(a.date);
  let text = '🎾 *RISULTATI TORNEO*\n';
  if(when) text += '📅 ' + when + '\n';
  text += '🏷 ' + mode;
  if(a.unofficial) text += ' · prova';
  if(a.excluded) text += ' · escluso dal rating';
  text += '\n\n';

  let anyUpset = false;
  (a.history || []).forEach(h => {
    text += '*Turno ' + h.round + '*\n';
    (h.matches || []).forEach(m => { anyUpset = anyUpset || isUpset(m); text += '• ' + m.a + ' – ' + m.b + ' → *' + scoreText(m) + '*' + (isUpset(m) ? ' ⚡' : '') + '\n'; });
    text += '\n';
  });
  if(anyUpset) text += '⚡ = sorpresa (risultato poco previsto)\n\n';

  if(a.extras && a.extras.length){
    text += '*Partite extra*\n';
    a.extras.forEach(x => {
      const w = x.weight !== undefined ? x.weight : (x.rating==='full' ? 1 : (x.rating==='reduced' ? 0.5 : 0));
      const tag = w === 0 ? ' (senza rating)' : (w < 1 ? ' (rating ridotto)' : '');
      text += '• ' + (x.teamA || []).join(' & ') + ' – ' + (x.teamB || []).join(' & ') + ' → *' + scoreText(x) + '*' + tag + '\n';
    });
    text += '\n';
  }

  if(a.mode && a.mode !== 'fixed'){
    const st = {};
    (a.history || []).forEach(h => (h.matches || []).forEach(m => {
      const add = (ids, sW, sL, win) => (ids || []).forEach(id => {
        if(!st[id]) st[id] = { id, wins:0, gW:0, gL:0 };
        st[id].gW += sW; st[id].gL += sL; st[id].wins += win;
      });
      const res = matchWinner(m.s1, m.s2, m.tb);
      const wA = res === 1 ? 1 : (res === 0.5 ? 0.5 : 0);
      const wB = res === 0 ? 1 : (res === 0.5 ? 0.5 : 0);
      add(m.pa, m.s1, m.s2, wA);
      add(m.pb, m.s2, m.s1, wB);
    }));
    const names = archiveIdNames(a);
    const rows = Object.values(st).map(r => ({
      name: names[r.id] || (roster[r.id] && roster[r.id].name) || r.id,
      wins: r.wins, gW: r.gW, gL: r.gL
    })).sort((x,y) => y.wins - x.wins || (y.gW-y.gL) - (x.gW-x.gL) || y.gW - x.gW);
    if(rows.length){
      text += '*Classifica serata*\n';
      const lines = [padR('#', 4) + padR('Giocatore', 12) + padL('V', 4) + padL('Game', 8)];
      rows.forEach((r,i) => {
        lines.push(padR(String(i+1)+'.', 4) + padR(cutStr(r.name, 11), 12) + padL(fmtWins(r.wins), 4) + padL(r.gW + '-' + r.gL, 8));
      });
      text += monoBlock(lines) + '\n';
    }
  } else if(a.teams && a.teams.length){
    const teams = (a.teams || []).map((tm, idx) => {
      let wins = 0, setsWon = 0, setsLost = 0;
      (a.history || []).forEach(h => (h.matches || []).forEach(m => {
        const isA = (m.aId === tm.id) || (m.aId === idx) || (m.a === tm.name);
        const isB = (m.bId === tm.id) || (m.bId === idx) || (m.b === tm.name);
        if(isA){ setsWon += m.s1; setsLost += m.s2; const res = matchWinner(m.s1,m.s2,m.tb); if(res===1) wins++; else if(res===0.5) wins += 0.5; }
        if(isB){ setsWon += m.s2; setsLost += m.s1; const res = matchWinner(m.s1,m.s2,m.tb); if(res===0) wins++; else if(res===0.5) wins += 0.5; }
      }));
      return { name: tm.name, wins, setsWon, setsLost };
    }).filter(x => x.name).sort((x,y) => y.wins - x.wins || (y.setsWon-y.setsLost) - (x.setsWon-x.setsLost));
    if(teams.some(x => x.wins || x.setsWon || x.setsLost)){
      text += '*Classifica squadre*\n';
      teams.forEach((r,i) => {
        text += (i+1) + '. ' + r.name + ' — ' + fmtWins(r.wins) + ' V (game ' + r.setsWon + '-' + r.setsLost + ')\n';
      });
      text += '\n';
    }
  }

  if(a.ratingChanges && a.ratingChanges.length){
    text += '*Variazioni Elo*\n' + eloChangesBlock(a.ratingChanges, 15) + '\n';
  }
  return text.trim();
}

// ---------- Tabellone live (kiosk) + timer ----------
const KIOSK_DEFAULT_SECS = 15 * 60;
let kioskTimeLeft = KIOSK_DEFAULT_SECS;   // secondi mostrati a timer fermo
let kioskEndAt = null;                    // istante (ms) di fine, a timer in marcia: resta esatto anche se il telefono mette in pausa la pagina
let kioskTimerInterval = null;
let kioskRound = null;   // turno per cui il timer è stato impostato; al cambio di turno il timer riparte da 15'
let kioskAudioCtx = null;
let kioskWakeLock = null;

function kioskRemaining(){
  if(kioskEndAt === null) return kioskTimeLeft;
  return Math.max(0, Math.ceil((kioskEndAt - Date.now()) / 1000));
}
function ensureKioskOverlay(){
  let el = document.getElementById('kioskOverlay');
  if(!el){
    el = document.createElement('div');
    el.id = 'kioskOverlay';
    document.body.appendChild(el);
  }
  return el;
}
function kioskIsOpen(){
  const el = document.getElementById('kioskOverlay');
  return !!(el && el.style.display !== 'none' && el.style.display !== '');
}
function stopKioskTimer(){
  kioskTimeLeft = kioskRemaining();
  kioskEndAt = null;
  if(kioskTimerInterval){ clearInterval(kioskTimerInterval); kioskTimerInterval = null; }
}
// Il bip richiede un tocco dell'utente per essere "sbloccato": lo si fa all'apertura del tabellone e all'avvio del timer.
function kioskAudioUnlock(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!kioskAudioCtx) kioskAudioCtx = new AC();
    if(kioskAudioCtx.state === 'suspended') kioskAudioCtx.resume();
  }catch(e){}
}
function kioskAlarm(){
  try{ if(navigator.vibrate) navigator.vibrate([400,150,400,150,400]); }catch(e){}
  try{
    if(!kioskAudioCtx) return;
    const ctx = kioskAudioCtx, t0 = ctx.currentTime + 0.05;
    for(let i = 0; i < 3; i++){
      const o = ctx.createOscillator(), g = ctx.createGain(), st = t0 + i * 0.45;
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.5, st + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.3);
      o.connect(g); g.connect(ctx.destination);
      o.start(st); o.stop(st + 0.32);
    }
  }catch(e){}
}
// Schermo sempre acceso finché il tabellone è aperto (se il telefono lo permette).
async function kioskWakeAcquire(){
  try{
    if(!('wakeLock' in navigator) || kioskWakeLock) return;
    const wl = await navigator.wakeLock.request('screen');
    kioskWakeLock = wl;
    wl.addEventListener('release', () => { if(kioskWakeLock === wl) kioskWakeLock = null; });
  }catch(e){ kioskWakeLock = null; }
}
function kioskWakeRelease(){
  try{ if(kioskWakeLock) kioskWakeLock.release(); }catch(e){}
  kioskWakeLock = null;
}
document.addEventListener('visibilitychange', () => {
  if(document.hidden) return;
  if(kioskIsOpen()) kioskWakeAcquire();   // il sistema lo rilascia quando la pagina va in secondo piano
  if(kioskTimerInterval) kioskTick();
});
function openKiosk(){
  if(!t.currentMatches || !t.currentMatches.length) return;
  if(kioskRound !== t.round){ stopKioskTimer(); kioskTimeLeft = KIOSK_DEFAULT_SECS; kioskRound = t.round; }
  kioskAudioUnlock();
  ensureKioskOverlay().style.display = 'flex';
  kioskWakeAcquire();
  renderKiosk();
  syncNav();
}
function closeKiosk(){
  stopKioskTimer();   // il timer si ferma chiudendo il tabellone: nessun conto alla rovescia invisibile
  kioskWakeRelease();
  const el = document.getElementById('kioskOverlay');
  if(el) el.style.display = 'none';
  syncNav();
}
// Chiamata a ogni render(): se il turno è cambiato o è stato chiuso, il tabellone si aggiorna o si chiude.
function syncKiosk(){
  if(!kioskIsOpen()) return;
  if(!t.currentMatches || !t.currentMatches.length){ closeKiosk(); return; }
  if(kioskRound !== t.round){ stopKioskTimer(); kioskTimeLeft = KIOSK_DEFAULT_SECS; kioskRound = t.round; }
  renderKiosk();
}
function adjustTimer(mins){
  let left = kioskRemaining() + mins * 60;
  left = Math.max(0, Math.min(99 * 60, left));
  if(kioskEndAt !== null){
    kioskEndAt = Date.now() + left * 1000;
    if(left === 0){ stopKioskTimer(); }
  } else {
    kioskTimeLeft = left;
  }
  renderKiosk();
}
function kioskTick(){
  if(kioskEndAt === null) return;   // timer fermo: niente da fare (e niente allarme ripetuto)
  if(kioskRemaining() === 0){ stopKioskTimer(); kioskAlarm(); }
  renderKiosk();
}
function toggleTimer(){
  kioskAudioUnlock();
  if(kioskTimerInterval){
    stopKioskTimer();
  } else if(kioskTimeLeft > 0){
    kioskEndAt = Date.now() + kioskTimeLeft * 1000;
    kioskTimerInterval = setInterval(kioskTick, 500);
  }
  renderKiosk();
}
function renderKiosk(){
  const el = ensureKioskOverlay();
  const left = kioskRemaining();
  const mins = String(Math.floor(left / 60)).padStart(2, '0');
  const secs = String(left % 60).padStart(2, '0');
  const over = left === 0;
  let html = '<div class="kiosk-header"><div class="kiosk-timer" onclick="toggleTimer()" title="Tocca per avviare/pausa"'+(over?' style="color:var(--danger);"':'')+'>'+mins+':'+secs+'</div>';
  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;">';
  html += '<button class="small" onclick="adjustTimer(1)">+1m</button>';
  html += '<button class="small" onclick="adjustTimer(-1)">-1m</button>';
  html += '<button class="small" onclick="adjustTimer(5)">+5m</button>';
  html += '<button class="small danger" onclick="closeKiosk()">Chiudi</button></div></div>';
  html += '<p class="section-label" style="margin-bottom:12px;">Turno '+t.round+(t.maxRounds ? ' di '+t.maxRounds : '')+' · '+(over ? 'tempo scaduto!' : (kioskTimerInterval ? 'tocca il timer per mettere in pausa' : 'tocca il timer per avviare'))+'</p>';
  (t.currentMatches || []).forEach((m, idx) => {
    const n = matchNamesForShare(m);
    html += '<div class="kiosk-match"><p class="kiosk-court">Campo '+(idx+1)+'</p>';
    html += '<div class="kiosk-teams"><span>'+esc(n.a)+'</span><span class="kiosk-vs">vs</span><span>'+esc(n.b)+'</span></div></div>';
  });
  const rests = restingNamesForShare();
  if(rests){
    html += '<p style="text-align:center;color:var(--ink-dim);margin-top:8px;font-size:14px;">Riposano: '+esc(rests)+'</p>';
  }
  el.innerHTML = html;
}

// ---------- Profilo giocatore (da archivio) ----------
let viewingPlayerId = null;
function openPlayerProfile(id){ viewingPlayerId = id; render(); }
function closePlayerProfile(){ viewingPlayerId = null; render(); }

function playerProfileView(id){
  const p = roster[id];
  if(!p) return '';
  const partners = {}, opponents = {};
  const eloHistory = [{ label: 'Inizio', val: p.elo0 !== undefined ? p.elo0 : START_ELO }];
  const glickoHistory = [];
  const winHistory = [];
  let cumW = 0, cumM = 0;
  const glickoSlice = [];
  const sideStats = { Sx:{m:0,w:0}, Dx:{m:0,w:0} }, sideByPartner = {};

  archive.forEach((a, aIdx) => {
    if(a.excluded) return;
    if(a.ratingChanges){
      const change = a.ratingChanges.find(r => r.id === id);
      if(change) eloHistory.push({ label: 'T'+(aIdx+1), val: change.after });
    }
    // Glicko progressivo: ricalcola dopo ogni torneo incluso
    glickoSlice.push(a);
    const gRows = computeGlicko(glickoSlice);
    const gRow = gRows.find(r => r.id === id);
    if(gRow) glickoHistory.push({ label: 'T'+(aIdx+1), val: gRow.rating, rd: gRow.rd });

    (a.history || []).forEach(h => (h.matches || []).forEach(m => {
      if(!m.sides) return;   // solo partite con lato registrato (dalla v28, squadre fisse)
      const iA = (m.sides.a || []).indexOf(id), iB = (m.sides.b || []).indexOf(id);
      if(iA < 0 && iB < 0) return;
      const mine = iA >= 0 ? m.sides.a : m.sides.b, pos = iA >= 0 ? iA : iB;
      const side = pos === 0 ? 'Sx' : 'Dx';
      const r = matchWinner(m.s1, m.s2, m.tb);
      const wv = r === 0.5 ? 0.5 : (((r === 1) === (iA >= 0)) ? 1 : 0);
      sideStats[side].m++; sideStats[side].w += wv;
      const partner = mine.find(x => x !== id);
      if(partner){
        if(!sideByPartner[partner]) sideByPartner[partner] = { Sx:{m:0,w:0}, Dx:{m:0,w:0} };
        sideByPartner[partner][side].m++; sideByPartner[partner][side].w += wv;
      }
    }));
    archiveGames(a).forEach(gm => {
      const inA = (gm.idsA || []).includes(id), inB = (gm.idsB || []).includes(id);
      if(!inA && !inB) return;
      const myTeam = inA ? gm.idsA : gm.idsB;
      const oppTeam = inA ? gm.idsB : gm.idsA;
      const res = matchWinner(gm.s1, gm.s2, gm.tb);
      let winVal = 0.5;
      if(res === 1) winVal = inA ? 1 : 0;
      else if(res === 0) winVal = inB ? 1 : 0;
      else winVal = 0.5;

      cumM++;
      cumW += winVal;
      winHistory.push({ label: String(cumM), val: (cumW / cumM) * 100 });

      myTeam.forEach(pid => {
        if(pid === id) return;
        if(!partners[pid]) partners[pid] = { matches:0, wins:0 };
        partners[pid].matches++;
        partners[pid].wins += winVal;
      });
      oppTeam.forEach(oid => {
        if(!opponents[oid]) opponents[oid] = { matches:0, wins:0 };
        opponents[oid].matches++;
        opponents[oid].wins += winVal;
      });
    });
  });

  // Se mancano ratingChanges, ricostruisci Elo dai tornei
  if(eloHistory.length === 1){
    const st = computeEloStates(archive, false);
    // punti per torneo: confronta snap progressivo
    let running = null;
    const slice = [];
    archive.forEach((a, aIdx) => {
      if(a.excluded) return;
      slice.push(a);
      const s2 = computeEloStates(slice, false);
      if(s2[id]){
        if(running === null) eloHistory[0] = { label: 'Inizio', val: (roster[id].elo0 !== undefined ? roster[id].elo0 : START_ELO) };
        eloHistory.push({ label: 'T'+(aIdx+1), val: s2[id].elo });
        running = s2[id].elo;
      }
    });
  }

  function ranked(obj, asc){
    return Object.keys(obj).map(k => ({
      id: k,
      name: roster[k] ? roster[k].name : k,
      matches: obj[k].matches,
      wr: obj[k].wins / obj[k].matches
    })).filter(x => x.matches >= 2).sort((a,b) => asc ? (a.wr - b.wr) : (b.wr - a.wr));
  }
  const bestPartners = ranked(partners, false);
  const nemeses = ranked(opponents, true);

  function ratingChart(history, title, unitSuffix){
    if(!history || history.length < 2) return '<p class="hint" style="margin:1rem 0;">'+esc(title)+': dati insufficienti per il grafico.</p>';
    // Coordinate in pixel di un viewBox largo (320x150): font e punti restano leggibili anche su telefono.
    const W = 320, H = 150, L = 26, R = 26, T = 24, B = 30;
    const vals = history.map(e => e.val);
    const pad = unitSuffix === '%' ? 2 : 15;
    const minV = Math.min(...vals) - pad, maxV = Math.max(...vals) + pad;
    const span = Math.max(1e-6, maxV - minV);
    const X = i => L + (i / (history.length - 1)) * (W - L - R);
    const Y = v => T + (1 - (v - minV) / span) * (H - T - B);
    const pts = history.map((e,i) => X(i).toFixed(1) + ',' + Y(e.val).toFixed(1)).join(' ');
    const many = history.length > 8;   // con molti punti, etichette del valore solo ogni tanto
    const dots = history.map((e,i) => {
      const x = X(i).toFixed(1), y = Y(e.val).toFixed(1);
      const lab = unitSuffix === '%' ? Math.round(e.val) + '%' : Math.round(e.val);
      const showVal = !many || i === 0 || i === history.length - 1 || i % 2 === 0;
      const showX = !many || i === 0 || i === history.length - 1 || i % 2 === 0;
      return '<circle cx="'+x+'" cy="'+y+'" r="4" fill="var(--card)" stroke="var(--ball)" stroke-width="2"/>'
        + (showVal ? '<text x="'+x+'" y="'+(Y(e.val)-9).toFixed(1)+'" fill="var(--ink)" font-size="11" text-anchor="middle" font-family="var(--font-head)">'+lab+'</text>' : '')
        + (showX ? '<text x="'+x+'" y="'+(H-8)+'" fill="var(--ink-dim)" font-size="10" text-anchor="middle" font-family="var(--font-head)">'+esc(e.label)+'</text>' : '');
    }).join('');
    return '<div style="margin:1.25rem 0 0.5rem;"><p class="section-label">'+esc(title)+'</p>'
      + '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(title)+'" style="width:100%;height:auto;display:block;overflow:visible;">'
      + '<polyline points="'+pts+'" fill="none" stroke="var(--ball)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
      + dots + '</svg></div>';
  }

  // Grafico in base alla classifica da cui si arriva
  let svgGraph = '';
  let headerRating = '';
  if(rankMode === 'glicko'){
    svgGraph = ratingChart(glickoHistory, 'Andamento Glicko-2', '');
    const lastG = glickoHistory.length ? glickoHistory[glickoHistory.length - 1] : null;
    if(lastG) headerRating = 'Glicko-2 <b>'+Math.round(lastG.val)+'</b>' + (lastG.rd !== undefined ? ' ±'+Math.round(lastG.rd) : '');
    else headerRating = 'Glicko-2 <b>—</b>';
  } else if(rankMode === 'win'){
    svgGraph = ratingChart(winHistory, 'Andamento % vittorie', '%');
    headerRating = p.matches ? ('% vittorie <b>'+Math.round((p.wins/p.matches)*100)+'%</b>') : '% vittorie <b>—</b>';
  } else {
    svgGraph = ratingChart(eloHistory, 'Andamento Elo', '');
    headerRating = 'Elo <b>'+Math.round(p.elo !== undefined ? p.elo : p.elo0)+'</b>';
  }

  let html = '<div class="modal-backdrop" onclick="closePlayerProfile()"><div class="modal-content" onclick="event.stopPropagation()">';
  html += '<h2 style="margin:0 0 4px;font-family:var(--font-head);font-size:22px;">'+esc(p.name)+(p.frozen?' ❄':'')+provTag(id)+'</h2>';
  html += '<p class="sub" style="margin:0 0 1rem;">'+headerRating;
  if(p.matches) html += ' · '+p.matches+' partite · '+Math.round((p.wins/p.matches)*100)+'% V';
  html += '</p>';
  html += svgGraph;
  html += '<p class="section-label">Chimica (min. 2 partite insieme / contro)</p>';
  html += '<div class="stat-box"><div><p style="margin:0;font-size:12px;color:var(--ink-dim);">Miglior partner</p>';
  html += '<p style="margin:4px 0 0;font-weight:600;">'+(bestPartners.length ? esc(bestPartners[0].name) : 'Dati insufficienti')+'</p></div>';
  if(bestPartners.length) html += '<div class="val">'+Math.round(bestPartners[0].wr*100)+'%<span style="font-size:11px;font-weight:400;color:var(--ink-dim);"> V</span></div>';
  html += '</div>';
  html += '<div class="stat-box"><div><p style="margin:0;font-size:12px;color:var(--ink-dim);">Nemesi (peggior avversario)</p>';
  html += '<p style="margin:4px 0 0;font-weight:600;">'+(nemeses.length ? esc(nemeses[0].name) : 'Dati insufficienti')+'</p></div>';
  if(nemeses.length) html += '<div class="val" style="color:var(--danger);">'+Math.round(nemeses[0].wr*100)+'%<span style="font-size:11px;font-weight:400;color:var(--ink-dim);"> tue V</span></div>';
  html += '</div>';
  if(sideStats.Sx.m + sideStats.Dx.m > 0){
    const pc = o => o.m ? Math.round(o.w / o.m * 100) + '%' : '—';
    html += '<p class="section-label" style="margin-top:14px;">Lato di gioco (solo partite con lato registrato)</p>';
    ['Sx','Dx'].forEach(sd => {
      html += '<div class="stat-box"><div><p style="margin:0;font-size:12px;color:var(--ink-dim);">'+(sd==='Sx'?'Sinistra (Sx)':'Destra (Dx)')+'</p><p style="margin:4px 0 0;font-weight:600;">'+sideStats[sd].m+(sideStats[sd].m===1?' partita':' partite')+'</p></div><div class="val">'+pc(sideStats[sd])+'<span style="font-size:11px;font-weight:400;color:var(--ink-dim);"> V</span></div></div>';
    });
    const few = sideStats.Sx.m < 5 || sideStats.Dx.m < 5;
    const rows = Object.keys(sideByPartner).map(k => ({ k, tot: sideByPartner[k].Sx.m + sideByPartner[k].Dx.m })).filter(x => x.tot >= 2).sort((a,b) => b.tot - a.tot).slice(0, 6);
    rows.forEach(x => {
      const o = sideByPartner[x.k], nm = roster[x.k] ? roster[x.k].name : x.k;
      html += '<p class="hint" style="margin:6px 0 0;">con '+esc(nm)+': Sx '+o.Sx.m+' ('+pc(o.Sx)+') · Dx '+o.Dx.m+' ('+pc(o.Dx)+')</p>';
    });
    if(few) html += '<p class="hint" style="margin-top:8px;">Poche partite per lato: i numeri sono solo indicativi.</p>';
  }
  html += '<button class="ghost" style="margin-top:1rem;" onclick="closePlayerProfile()">Chiudi scheda</button>';
  html += '</div></div>';
  return html;
}

function rankingView(){
  const all = activeKeys().map(k => ({key:k, ...roster[k]})).filter(p => !p.frozen);
  const diagBtn = '<button class="ghost" style="margin-top:14px;" onclick="showDiag=true;showRanking=false;render();">Diagnostica rating</button>';
  let html = '<section><p class="section-label">Classifica giocatori</p>';
  if(activeKeys().some(k => roster[k].frozen)){ html += '<p class="hint">I giocatori con rating ❄ congelato non compaiono in classifica.</p>'; }
  html += '<div class="seg"><button class="small'+(rankMode==='elo'?' on':'')+'" onclick="setRankMode(\'elo\')">Elo</button>';
  html += '<button class="small'+(rankMode==='win'?' on':'')+'" onclick="setRankMode(\'win\')">% vittorie</button>';
  html += '<button class="small'+(rankMode==='glicko'?' on':'')+'" onclick="setRankMode(\'glicko\')">Glicko-2</button></div>';
  html += '<div class="btn-pair" style="margin-bottom:12px;"><button class="secondary" style="margin-top:0;" onclick="shareRankingWhatsApp()">Condividi classifica</button><button class="secondary" style="margin-top:0;" onclick="shareTrendsWhatsApp()">Condividi trend</button></div>';

  if(rankMode === 'glicko'){
    html += '<p class="hint">Rating ricalcolato dai tornei archiviati (ogni torneo chiuso è un periodo di valutazione, i tornei di prova sono esclusi). Il ± indica quanto il rating è incerto: scende con le partite e risale se salti delle serate. Ogni partita vale in base al punteggio (conclusa: da 0,81 per il 6-5 a 1 per il 6-0; interrotta o pari: tra 0,5 e 0,75). Parte dal rating iniziale (come l\'Elo); i congelati ❄ restano fissi e non compaiono in classifica. Le frecce mostrano il cambio di posizione dovuto all\'ultimo torneo archiviato.</p>';
    const rows = computeGlicko().filter(r => !(roster[r.id] && roster[r.id].frozen)).sort((a,b)=> b.rating-a.rating || a.name.localeCompare(b.name));
    const seenIds = new Set(rows.map(r => r.id));
    const rest = all.filter(p => !seenIds.has(p.key)).sort((a,b)=> a.name.localeCompare(b.name));
    if(rows.length === 0){
      html += '<p class="roster-empty">Nessuna partita archiviata ancora: chiudi un torneo per vedere il Glicko-2.</p>';
    } else {
      html += '<div class="rank-list">';
      const ranks = computeRanks(rows, r => Math.round(r.rating));
      const mvG = movement(positionsGlicko);
      rows.forEach((r,i) => {
        const rk = ranks[i];
        html += '<div class="rank-row'+(rk.rank===1?' top1':'')+'"><span class="rank-num'+(rk.tied?' tied':'')+'">'+rankLabel(rk)+'</span>';
        html += '<span class="rank-name clickable" onclick="openPlayerProfile(\''+r.id+'\')">'+esc(r.name)+'</span>'+provTag(r.id);
        html += arrow(mvG, r.id);
        html += '<span class="rank-elo">'+Math.round(r.rating)+'</span>';
        html += '<span class="rank-meta">±'+Math.round(r.rd)+' · '+r.games+'</span></div>';
      });
      html += '</div>';
    }
    if(rest.length > 0){
      html += '<p class="hint" style="margin-top:10px;">Senza partite archiviate: '+rest.map(p => esc(p.name)).join(', ')+'.</p>';
    }
    html += diagBtn;
    html += '</section>';
    return html;
  }

  if(rankMode === 'win'){
    html += '<p class="hint">Percentuale di partite vinte (un pareggio vale mezza vittoria). Serve un minimo di '+MIN_MATCHES_WINRATE+' partite per avere una posizione. Non tiene conto della forza degli avversari: per quello c\'è l\'Elo. Le frecce mostrano il cambio di posizione dovuto all\'ultimo torneo archiviato.</p>';
    const ranked = all.filter(p => p.matches >= MIN_MATCHES_WINRATE)
      .sort((a,b)=> winRate(b)-winRate(a) || b.matches-a.matches || a.name.localeCompare(b.name));
    const rest = all.filter(p => p.matches < MIN_MATCHES_WINRATE)
      .sort((a,b)=> b.matches-a.matches || a.name.localeCompare(b.name));
    if(all.length === 0){
      html += '<p class="roster-empty">Nessuno storico ancora.</p>';
    } else {
      if(ranked.length === 0){
        html += '<p class="roster-empty">Nessun giocatore ha ancora '+MIN_MATCHES_WINRATE+' partite.</p>';
      } else {
        html += '<div class="rank-list">';
        const ranks = computeRanks(ranked, p => Math.round(winRate(p)*100));
        const mvWin = movement(positionsWin);
        ranked.forEach((p,i) => {
          const r = ranks[i];
          html += '<div class="rank-row'+(r.rank===1?' top1':'')+'"><span class="rank-num'+(r.tied?' tied':'')+'">'+rankLabel(r)+'</span>';
          html += '<span class="rank-name clickable" onclick="openPlayerProfile(\''+p.key+'\')">'+esc(p.name)+'</span>'+provTag(p.key);
          html += arrow(mvWin, p.key);
          html += '<span class="rank-elo">'+Math.round(winRate(p)*100)+'%</span>';
          html += '<span class="rank-meta">'+fmtWins(p.wins)+' / '+p.matches+'</span></div>';
        });
        html += '</div>';
      }
      if(rest.length > 0){
        html += '<p class="section-label" style="margin-top:14px;">Meno di '+MIN_MATCHES_WINRATE+' partite</p>';
        html += '<div class="rank-list">';
        rest.forEach(p => {
          const wr = winRate(p);
          html += '<div class="rank-row"><span class="rank-num"></span><span class="rank-name" style="color:var(--ink-dim);">'+esc(p.name)+'</span>';
          html += '<span class="rank-meta">'+(wr===null ? '—' : fmtWins(p.wins)+' / '+p.matches)+'</span></div>';
        });
        html += '</div>';
      }
    }
    html += diagBtn;
    html += '</section>';
    return html;
  }

  html += '<p class="hint">Punteggio Elo: sale o scende in base alla forza degli avversari affrontati, non solo al risultato. Si ricalcola dai tornei archiviati, partendo dal rating iniziale (di base 1000). I congelati ❄ restano fissi e non compaiono in classifica. Le frecce mostrano il cambio di posizione dovuto all\'ultimo torneo archiviato.</p>';
  // Come nelle altre classifiche, chi non ha ancora partite archiviate non compare in graduatoria.
  const list = all.filter(p => p.matches > 0).sort((a,b)=> (b.elo||START_ELO) - (a.elo||START_ELO) || a.name.localeCompare(b.name));
  const idle = all.filter(p => !(p.matches > 0)).sort((a,b)=> a.name.localeCompare(b.name));
  if(list.length === 0){
    html += '<p class="roster-empty">Nessuno storico ancora.</p>';
  } else {
    html += '<div class="rank-list">';
    const ranks = computeRanks(list, p => Math.round(p.elo||START_ELO));
    const mvElo = movement(positionsElo);
    list.forEach((p,i) => {
      const wr = winRate(p);
      const r = ranks[i];
      html += '<div class="rank-row'+(r.rank===1?' top1':'')+'"><span class="rank-num'+(r.tied?' tied':'')+'">'+rankLabel(r)+'</span>';
      html += '<span class="rank-name clickable" onclick="openPlayerProfile(\''+p.key+'\')">'+esc(p.name)+'</span>'+provTag(p.key);
      html += arrow(mvElo, p.key);
      html += '<span class="rank-elo">'+Math.round(p.elo||START_ELO)+'</span>';
      html += '<span class="rank-meta">'+(wr===null?'—':Math.round(wr*100)+'% · '+p.matches)+'</span></div>';
    });
    html += '</div>';
  }
  if(idle.length > 0){
    html += '<p class="hint" style="margin-top:10px;">Senza partite archiviate: '+idle.map(p => esc(p.name)).join(', ')+'.</p>';
  }
  html += diagBtn;
  html += '</section>';
  return html;
}

function render(){
  renderMain();
  syncKiosk();
  syncNav();
}
function renderMain(){
  const app = document.getElementById('app');
  if(viewingPlayerId){
    document.getElementById('title').textContent = 'Profilo';
    document.getElementById('subtitle').textContent = 'Statistiche dal tuo archivio locale.';
    app.innerHTML = playerProfileView(viewingPlayerId);
    return;
  }
  document.getElementById('title').textContent = showDiag ? 'Diagnostica rating' : showRanking ? 'Classifica giocatori' : (showTeamRanking ? 'Classifica squadre' : (showArchive ? 'Tornei passati' : (t.phase==='setup' ? 'Nuovo torneo' : 'Torneo in corso')));
  document.getElementById('foot').textContent = (!showRanking && !showTeamRanking && !showArchive && t.phase==='playing') ? ((t.mode && t.mode!=='fixed' ? t.players.length+' giocatori · '+({americano:'Americano',messicano:'Messicano'}[t.mode]) : t.teams.length+' squadre')+' · '+t.courts+' campi · '+t.maxRounds+' turni') : '';

  let html = '<div class="btn-pair" style="margin-bottom:1.25rem;">';
  html += '<button class="ghost'+(showRanking ? ' back-active' : '')+'" onclick="showDiag=false;showRanking=!showRanking;showTeamRanking=false;showArchive=false;render();">'+(showRanking ? 'Torna al torneo' : 'Classifica giocatori')+'</button>';
  html += '<button class="ghost'+(showTeamRanking ? ' back-active' : '')+'" onclick="showDiag=false;showTeamRanking=!showTeamRanking;showRanking=false;showArchive=false;render();">'+(showTeamRanking ? 'Torna al torneo' : 'Classifica squadre')+'</button>';
  html += '<button class="ghost'+(showArchive ? ' back-active' : '')+'" onclick="showDiag=false;showArchive=!showArchive;showRanking=false;showTeamRanking=false;render();">'+(showArchive ? 'Torna al torneo' : 'Tornei passati')+'</button>';
  html += '</div>';

  if(showDiag){
    html += diagView();
    app.innerHTML = html;
    return;
  }
  if(showRanking){
    html += rankingView();
    app.innerHTML = html;
    return;
  }
  if(showTeamRanking){
    html += teamRankingView();
    app.innerHTML = html;
    return;
  }
  if(showArchive){
    html += archiveView();
    app.innerHTML = html;
    return;
  }

  if(t.phase === 'setup'){
    html += ratingSummaryView();
    html += backupBanner();
    html += rosterPanel();

    html += '<section><p class="section-label">Tipo di torneo</p><div class="seg">';
    html += '<button class="small'+(pendingMode==='fixed'?' on':'')+'" onclick="setPendingMode(\'fixed\')">Squadre fisse</button>';
    html += '<button class="small'+(pendingMode==='americano'?' on':'')+'" onclick="setPendingMode(\'americano\')">Americano</button>';
    html += '<button class="small'+(pendingMode==='messicano'?' on':'')+'" onclick="setPendingMode(\'messicano\')">Messicano</button>';
    html += '</div>';
    if(pendingMode === 'fixed'){
      html += '<p class="hint">Le coppie restano le stesse per tutta la serata.</p></section>';
    } else if(pendingMode === 'americano'){
      html += '<p class="hint">I compagni cambiano ogni turno, mescolati per giocare il più possibile con tutti evitando ripetizioni. Punteggio individuale: ogni giocatore somma i game fatti dalla sua coppia.</p></section>';
    } else {
      html += '<p class="hint">I compagni cambiano ogni turno in base alla classifica del momento (chi è in testa gioca con chi è più indietro nel suo gruppo). Punteggio individuale come nell\'Americano.</p></section>';
    }

    if(pendingMode === 'fixed'){
      html += '<section><div class="seg"><button class="small'+(suggestBy==='elo'?' on':'')+'" onclick="setSuggestBy(\'elo\')">Abbina per Elo</button>';
      html += '<button class="small'+(suggestBy==='glicko'?' on':'')+'" onclick="setSuggestBy(\'glicko\')">Abbina per Glicko-2</button></div>';
      html += '<label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;"><input type="checkbox" '+(varyPairs?'checked':'')+' onchange="setVaryPairs(this.checked)" style="width:18px;height:18px;accent-color:var(--ball);flex-shrink:0;" /> Un po\' di casualità (giocatori di forza simile si scambiano)</label>';
      html += '<label style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13.5px;"><input type="checkbox" '+(ignoreSides?'checked':'')+' onchange="setIgnoreSides(this.checked)" style="width:18px;height:18px;accent-color:var(--ball);flex-shrink:0;" /> Ignora Sx/Dx dichiarati</label>';
      html += '<button class="secondary" onclick="suggestPairings()">Suggerisci abbinamenti</button>';
      html += '<button class="ghost" onclick="addEmptyTeam()">Oppure crea una squadra a mano</button>';
      if(draftTeams.length === 0){ html += '<p class="err" id="setupErr"></p>'; }
      html += '</section>';
    } else {
      html += '<section><p class="section-label">Serata</p><div class="row2">';
      html += '<div><label class="field">Campi disponibili</label><input type="number" id="courtsInput" min="1" value="'+(t.courts||3)+'" oninput="updateCourts(this.value)" /></div>';
      html += '<div><label class="field">Turni da giocare</label><input type="number" id="roundsInput" min="1" value="'+(t.maxRounds||3)+'" oninput="updateRounds(this.value)" /></div>';
      html += '</div>';
      html += '<label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;"><input type="checkbox" '+(t.unofficial?'checked':'')+' onchange="t.unofficial=this.checked;saveTournament();" style="width:18px;height:18px;accent-color:var(--ball);flex-shrink:0;" /> Torneo di prova (i risultati non contano per Elo, classifiche e storico)</label>';
      html += '<button class="primary" onclick="startRotatingTournament()" style="margin-top:14px;">Inizia torneo</button>';
      html += '<p class="err" id="setupErr"></p></section>';
    }

    if(pendingMode === 'fixed' && draftTeams.length > 0){
      const options = Array.from(selected).map(k => roster[k] ? roster[k].name : k).sort((a,b)=> a.localeCompare(b));
      const gmDraft = strengthMap();
      const tStr = {};
      draftTeams.forEach(dt => { tStr[dt.id] = draftTeamStrength(dt, gmDraft); });
      const sVals = Object.values(tStr).filter(v => v !== null);
      const sMin = sVals.length ? Math.min(...sVals) : 0, sMax = sVals.length ? Math.max(...sVals) : 0;
      const sMean = sVals.length ? sVals.reduce((a,b)=>a+b,0)/sVals.length : 0;
      const methodLabel = suggestBy === 'glicko' ? 'Glicko-2' : 'Elo';
      const allStr = [];
      draftTeams.forEach(dt => [dt.p1, dt.p2].filter(x => x && x.trim()).forEach(nm => allStr.push(strengthOfName(nm, gmDraft))));
      const allMean = allStr.length ? allStr.reduce((a,b)=>a+b,0)/allStr.length : 0;
      const sdAllDraft = allStr.length ? Math.sqrt(allStr.reduce((a,b)=>a+(b-allMean)*(b-allMean),0)/allStr.length) : 0;
      html += '<section><p class="section-label">Squadre</p>';
      if(sVals.length >= 2){
        html += '<p class="hint"><b>Forza media delle squadre ('+methodLabel+'):</b> da '+Math.round(sMin)+' a '+Math.round(sMax)+' &middot; differenza tra la più forte e la più debole: '+Math.round(sMax-sMin)+' punti.</p>';
      }
      if(suggestNote){ html += '<p class="hint"><b>'+esc(suggestNote)+'</b></p>'; }
      html += '<p class="hint">Scegli un nome già assegnato altrove per scambiarlo con quello attuale.</p>';
      draftTeams.forEach(dt => {
        html += '<div class="team-card"><div class="team-card-head"><p class="section-label">Squadra '+(dt.id+1)+'</p><button class="small" onclick="removeTeam('+dt.id+')">Rimuovi</button></div>';
        html += '<div class="team-players">';
        ['p1','p2'].forEach((field,fi) => {
          html += '<div><p class="hint" style="margin:0 0 3px;font-size:11px;">'+(fi===0?'Sx':'Dx')+'</p>';
          html += '<select onchange="assignSlot('+dt.id+',\''+field+'\',this.value)">';
          html += '<option value=""'+(!dt[field]?' selected':'')+'>—</option>';
          options.forEach(name => {
            const owner = draftTeams.find(o => o.id!==dt.id && (o.p1===name || o.p2===name));
            const label = (owner ? name+' (Squadra '+(owner.id+1)+')' : name)+' · '+Math.round(strengthOfName(name, gmDraft));
            html += '<option value="'+name+'"'+(dt[field]===name?' selected':'')+'>'+label+'</option>';
          });
          html += '</select></div>';
        });
        html += '</div>';
        const st = tStr[dt.id];
        if(st !== null){
          const incomplete = !(dt.p1 && dt.p1.trim() && dt.p2 && dt.p2.trim());
          const delta = st - sMean;
          const pct = sMax > sMin ? 12 + 88*(st - sMin)/(sMax - sMin) : 60;
          const off = sVals.length>=2 && Math.abs(delta) > 0.6*sdAllDraft;   // squadra nettamente più forte/debole delle altre
          html += '<div class="strength-row"><span>Forza <b>'+Math.round(st)+'</b></span><span'+(off?' style="color:var(--danger);font-weight:600;"':'')+'>'+(sVals.length>=2 ? (delta>=0?'+':'')+Math.round(delta)+' sulla media'+(off?' ⚠':'') : '')+(incomplete?' &middot; incompleta':'')+'</span><div class="strength-bar"><i style="width:'+pct.toFixed(0)+'%"></i></div></div>';
        }
        html += '</div>';
      });
      html += '<button class="ghost" onclick="addEmptyTeam()">Aggiungi un\'altra squadra</button>';
      html += '</section>';

      html += '<section><p class="section-label">Serata</p><div class="row2">';
      html += '<div><label class="field">Campi disponibili</label><input type="number" id="courtsInput" min="1" value="'+(t.courts||3)+'" oninput="updateCourts(this.value)" /></div>';
      html += '<div><label class="field">Turni da giocare</label><input type="number" id="roundsInput" min="1" value="'+(t.maxRounds||3)+'" oninput="updateRounds(this.value)" /></div>';
      html += '</div>';
      html += '<label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;"><input type="checkbox" '+(t.unofficial?'checked':'')+' onchange="t.unofficial=this.checked;saveTournament();" style="width:18px;height:18px;accent-color:var(--ball);flex-shrink:0;" /> Torneo di prova (i risultati non contano per Elo, classifiche e storico)</label>';
      html += '<button class="primary" onclick="startTournament()" style="margin-top:14px;">Inizia torneo</button>';
      html += '<p class="err" id="setupErr"></p></section>';
    }

    html += dataSection();

  } else if(t.phase === 'playing'){
    const rotating = !!(t.mode && t.mode !== 'fixed');
    if(t.unofficial){ html += '<div class="banner">Torneo di prova: i risultati non vengono salvati in Elo, classifiche o storico.</div>'; }
    if(t.currentMatches.length > 0){
      html += '<section><p class="section-label">Turno '+t.round+' di '+t.maxRounds+'</p>';
      if(pairEdit){
        const gmRound = strengthMap(), methodLabel = suggestBy === 'glicko' ? 'Glicko-2' : 'Elo';
        if(pairEdit.type === 'fixed'){
          const teams = pairEditTeams();
          const courtStrengths = pairEdit.courts.map(c => {
            const tA = t.teams.find(x=>x.id===c.a), tB = t.teams.find(x=>x.id===c.b);
            const av = tA ? teamStrengthNames(tA.players, gmRound) : null;
            const bv = tB ? teamStrengthNames(tB.players, gmRound) : null;
            if(av === null || bv === null) return null;
            return { a: av, b: bv };
          });
          html += methodToggleHtml();
          html += courtsSummaryHtml(courtStrengths, methodLabel);
          html += '<p class="hint">Scegli una squadra già assegnata altrove per scambiarla. Se scegli una squadra a riposo, quella sostituita passa a riposo. Cambiando gli abbinamenti il calendario si adatta ai turni successivi.</p>';
          pairEdit.courts.forEach((c, court) => {
            html += '<div class="match-card"><p class="match-court">Campo '+(court+1)+'</p>';
            html += '<div class="team-players">'+fixedTeamSelect(court,'a',teams)+fixedTeamSelect(court,'b',teams)+'</div>';
            html += strengthRowHtml(courtStrengths, court);
            html += '</div>';
          });
        } else {
          const players = pairEditPlayers();
          const courtStrengths = pairEdit.courts.map(c => {
            const av = teamStrengthIds(c.pa, gmRound), bv = teamStrengthIds(c.pb, gmRound);
            if(av === null || bv === null) return null;
            return { a: av, b: bv };
          });
          html += methodToggleHtml();
          html += courtsSummaryHtml(courtStrengths, methodLabel);
          pairEdit.courts.forEach((c, court) => {
            html += '<div class="match-card"><p class="match-court">Campo '+(court+1)+'</p>';
            html += '<div class="team-players">'+pairEditSelect(court,'pa',0,players)+pairEditSelect(court,'pa',1,players)+'</div>';
            html += '<p style="text-align:center;opacity:.7;margin:6px 0;">vs</p>';
            html += '<div class="team-players">'+pairEditSelect(court,'pb',0,players)+pairEditSelect(court,'pb',1,players)+'</div>';
            html += strengthRowHtml(courtStrengths, court);
            html += '</div>';
          });
        }
        html += '<p class="err" id="pairEditErr"></p>';
        html += '<div class="btn-pair"><button class="ghost" onclick="cancelPairEdit()">Annulla</button><button class="primary" onclick="applyPairEdit()">Applica abbinamenti</button></div></section>';
      } else {
      html += '<button class="ghost" style="margin-bottom:10px;" onclick="openPairEdit()">Cambia abbinamenti</button>';
      html += '<div class="btn-pair" style="margin-bottom:10px;"><button class="secondary" style="margin-top:0;" onclick="shareRoundWhatsApp()">Condividi turno</button><button class="secondary" style="margin-top:0;" onclick="openKiosk()">Tabellone live</button></div>';
      if(t.history && t.history.length){ html += '<button class="ghost" style="margin-bottom:10px;" onclick="shareLiveResults()">Condividi risultati finora</button>'; }
      const gmRound2 = strengthMap(), methodLabel2 = suggestBy === 'glicko' ? 'Glicko-2' : 'Elo';
      const courtStrengths = t.currentMatches.map(m => {
        if(rotating){
          const av = teamStrengthIds(m.pa, gmRound2), bv = teamStrengthIds(m.pb, gmRound2);
          if(av === null || bv === null) return null;
          return { a: av, b: bv };
        }
        const teamA = t.teams.find(x=>x.id===m[0]), teamB = t.teams.find(x=>x.id===m[1]);
        if(!teamA || !teamB) return null;
        const av = teamStrengthNames(teamA.players, gmRound2), bv = teamStrengthNames(teamB.players, gmRound2);
        if(av === null || bv === null) return null;
        return { a: av, b: bv };
      });
      html += methodToggleHtml();
      html += courtsSummaryHtml(courtStrengths, methodLabel2);
      t.currentMatches.forEach((m,idx) => {
        const nameA = rotating ? m.aName : t.teams.find(x=>x.id===m[0]).name;
        const nameB = rotating ? m.bName : t.teams.find(x=>x.id===m[1]).name;
        const rd = roundDraft[idx] || {};
        const tbOpen = (rd.s1==='6' && rd.s2==='6');
        html += '<div class="match-card"><p class="match-court">Campo '+(idx+1)+'</p><div class="match-row">';
        html += '<span class="team-name">'+teamLabelHtml(nameA)+'</span>';
        html += '<input class="score-input" id="s1_'+idx+'" type="number" min="0" inputmode="numeric" value="'+esc(rd.s1||'')+'" oninput="setRoundScore('+idx+',\'s1\',this.value); toggleTbRow(\'s1_'+idx+'\',\'s2_'+idx+'\',\'tbrow_'+idx+'\')" />';
        html += '<span class="dash">&ndash;</span>';
        html += '<input class="score-input" id="s2_'+idx+'" type="number" min="0" inputmode="numeric" value="'+esc(rd.s2||'')+'" oninput="setRoundScore('+idx+',\'s2\',this.value); toggleTbRow(\'s1_'+idx+'\',\'s2_'+idx+'\',\'tbrow_'+idx+'\')" />';
        html += '<span class="team-name right">'+teamLabelHtml(nameB)+'</span></div>';
        html += '<div class="tb-row" id="tbrow_'+idx+'" style="'+(tbOpen?'':'display:none;')+'"><span class="tb-label">Tie-break</span><input class="score-input tb-input" id="tb1_'+idx+'" type="number" min="0" inputmode="numeric" value="'+esc(rd.tb1||'')+'" oninput="setRoundScore('+idx+',\'tb1\',this.value)" /><span class="dash">&ndash;</span><input class="score-input tb-input" id="tb2_'+idx+'" type="number" min="0" inputmode="numeric" value="'+esc(rd.tb2||'')+'" oninput="setRoundScore('+idx+',\'tb2\',this.value)" /></div>';
        if(!rotating){
          html += '<div class="swap-row">'
            + '<label title="Spunta se in questa partita la squadra ha giocato coi lati Sx/Dx scambiati"><input type="checkbox" '+(rd.swA?'checked':'')+' onchange="setRoundSwap('+idx+',\'A\',this.checked)" /><span>Lati invertiti</span></label>'
            + '<label class="right" title="Spunta se in questa partita la squadra ha giocato coi lati Sx/Dx scambiati"><input type="checkbox" '+(rd.swB?'checked':'')+' onchange="setRoundSwap('+idx+',\'B\',this.checked)" /><span>Lati invertiti</span></label></div>';
        }
        html += strengthRowHtml(courtStrengths, idx);
        html += '</div>';
      });
      if(t.restingThisRound && t.restingThisRound.length > 0){
        const names = rotating ? t.restingThisRound.map(playerName).join(', ') : t.restingThisRound.map(id => t.teams.find(x=>x.id===id).name).join(', ');
        html += '<p class="resting">Riposa: '+names+'</p>';
      }
      html += '<p class="err" id="err"></p>';
      html += '<button class="primary" onclick="submitResults()">Salva risultati</button></section>';
      }
    } else if(t.round < t.maxRounds){
      html += '<section><button class="primary" onclick="generateRound()">Genera turno '+(t.round+1)+' di '+t.maxRounds+'</button>';
      if(t.round > 0){ html += '<button class="ghost" onclick="undoLastRound()">Torna al turno precedente</button>'; }
      if(t.round > 0 || (t.extras && t.extras.length > 0)){ html += '<button class="ghost" onclick="finishTournament()">Termina torneo</button>'; }
      html += '</section>';
    } else {
      html += '<section><div class="banner">Turni previsti completati.</div>';
      html += '<button class="primary" onclick="finishTournament()">Termina torneo</button>';
      html += '<button class="ghost" onclick="generateRound()">Gioca un turno extra</button>';
      html += '<button class="ghost" onclick="undoLastRound()">Torna al turno precedente</button></section>';
    }

    if(t.round > 0 && rotating){
      const st = liveIndividualStats();
      const rows = t.players.map(id => ({ id, name: playerName(id), ...st[id] })).sort((a,b)=> b.wins-a.wins || (b.gW-b.gL)-(a.gW-a.gL) || b.gW-a.gW);
      const ranks = computeRanks(rows, r => r.wins+'-'+(r.gW-r.gL));
      html += '<section><p class="section-label">Classifica</p><table><tr><th>Giocatore</th><th class="num">V</th><th class="num">Game</th></tr>';
      rows.forEach((r,i) => {
        const rk = ranks[i];
        html += '<tr class="pos-'+rk.rank+'"><td><span class="rank'+(rk.tied?' tied':'')+'">'+rankLabel(rk)+'</span>'+esc(r.name)+'</td><td class="num">'+r.wins+'</td><td class="num">'+r.gW+'-'+r.gL+'</td></tr>';
      });
      html += '</table></section>';
    } else if(t.round > 0){
      const sorted = [...t.teams].sort(standingsSort);
      const ranks = computeRanks(sorted, tm => tm.wins+'-'+(tm.setsWon-tm.setsLost));
      html += '<section><p class="section-label">Classifica</p><table><tr><th>Squadra</th><th class="num">V</th><th class="num">Set</th></tr>';
      sorted.forEach((tm,i) => {
        const r = ranks[i];
        html += '<tr class="pos-'+r.rank+'"><td><span class="rank'+(r.tied?' tied':'')+'">'+rankLabel(r)+'</span>'+tm.name+'</td><td class="num">'+tm.wins+'</td><td class="num">'+tm.setsWon+'-'+tm.setsLost+'</td></tr>';
      });
      html += '</table></section>';
    }

    html += extrasSection();

    if(t.history.length > 0){
      html += '<section>';
      [...t.history].reverse().forEach(h => {
        html += '<div class="history-round"><p class="section-label">Turno '+h.round+'</p>';
        h.matches.forEach(m => { html += '<div class="history-match"><span><b>'+m.a+'</b> vs <b>'+m.b+'</b></span><span>'+m.s1+' &ndash; '+m.s2+(m.tb?' <span class="tb-inline">(tb '+m.tb[0]+'-'+m.tb[1]+')</span>':'')+upsetTag(m)+'</span></div>'; });
        html += '</div>';
      });
      html += '</section>';
    }

    html += dataSection();

    if(resetArmed){
      html += '<div class="banner warn"><p style="margin:0 0 10px;">Ricominciare da zero? Il torneo in corso verrà perso e i rating non cambiano.</p>';
      html += '<div style="display:flex;gap:8px;"><button class="primary" style="background:var(--danger);color:#fff;" onclick="resetAll()">Sì, ricomincia</button>';
      html += '<button class="ghost" style="margin-top:0;" onclick="cancelReset()">Annulla</button></div></div>';
    } else {
      html += '<button class="ghost" onclick="resetAll()">Annulla torneo</button>';
    }
  }

  app.innerHTML = html;
}

// Id nascosti, pesi delle extra e rating derivati dall'archivio.
function initData(){
  ensureArchiveIds();
  const beforeElo = {};
  Object.keys(roster).forEach(id => { beforeElo[id] = roster[id].elo; });
  recomputeRatings();
  if(ratingMigration){
    const changed = Object.keys(roster).filter(id => !roster[id].hidden && Math.abs((beforeElo[id]===undefined ? START_ELO : beforeElo[id]) - roster[id].elo) > 0.05).length;
    saveRoster(); saveArchive();
    ratingMigration = false;
    if(changed > 0) dataMsg = 'I rating ora si ricalcolano dai tornei archiviati (partenza da 1000): per '+changed+' giocatori il valore è cambiato rispetto a prima.';
  }
}

// ---------- Tasto indietro del telefono ----------
// Ogni schermata "sopra" il torneo (grafici/profilo, diagnostica, classifiche, archivio, modifiche in corso, tabellone)
// è un livello. Indietro chiude il livello più alto; dal torneo (nessun livello) chiede conferma prima di uscire.
let navIdx = 0;          // posizione corrente nella cronologia del browser (0 = sentinella di uscita, 1 = torneo)
let navIgnore = 0;       // popstate provocati da noi (riallineamenti), da non interpretare come "indietro" dell'utente
let navBusy = false;
let navReady = false;
let navExitArmed = false;
let navExitTimer = null;
function showToast(msg){ const el = document.getElementById('toast'); if(!el) return; el.textContent = msg; el.style.display = 'block'; }
function hideToast(){ const el = document.getElementById('toast'); if(el) el.style.display = 'none'; }
function navExitDisarm(){
  clearTimeout(navExitTimer);
  if(!navExitArmed) return;
  navExitArmed = false;
  hideToast();
  if(navReady && navIdx === 0){
    navIdx = 1;
    navIgnore = 1;
    try{ history.go(1); }catch(e){ navIgnore = 0; }
    setTimeout(() => { if(navIgnore > 0){ navIgnore = 0; syncNav(); } }, 800);
  }
}
function navLayers(){
  const L = [];
  if(pairEdit) L.push('pairedit');
  if(extraDraft) L.push('extra');
  if(showDiag) L.push('ranking', 'diag');
  else if(showRanking) L.push('ranking');
  else if(showTeamRanking) L.push('teams');
  else if(showArchive){
    L.push('archive');
    if(archiveExtraDraft || archiveRoundDraft || archiveRemoveConfirm) L.push('archivedraft');
  }
  if(viewingPlayerId) L.push('profile');
  if(kioskIsOpen()) L.push('kiosk');
  return L;
}
function navCloseTop(){
  const L = navLayers();
  switch(L[L.length - 1]){
    case 'kiosk': closeKiosk(); break;
    case 'profile': viewingPlayerId = null; break;
    case 'diag': showDiag = false; showRanking = true; break;
    case 'ranking': showRanking = false; break;
    case 'teams': showTeamRanking = false; break;
    case 'archivedraft': archiveExtraDraft = null; archiveRoundDraft = null; archiveRemoveConfirm = null; break;
    case 'archive': showArchive = false; break;
    case 'extra': extraDraft = null; break;
    case 'pairedit': pairEdit = null; break;
  }
}
function navCloseAll(){
  let guard = 12;
  while(navLayers().length > 0 && guard-- > 0) navCloseTop();
}
function syncNav(){
  if(!navReady || navBusy) return;
  // Riallineamento già avvenuto (la cronologia è già sulla voce attesa): non serve più aspettare il popstate.
  if(navIgnore > 0 && history.state && history.state.nav === navIdx) navIgnore = 0;
  if(navIgnore > 0) return;
  const want = navLayers().length + 1;
  try{
    if(want > navIdx){
      if(navExitArmed){ navExitArmed = false; clearTimeout(navExitTimer); hideToast(); }   // l'utente ha fatto altro: l'avviso di uscita decade
      while(navIdx < want){ navIdx++; history.pushState({ padel:1, nav:navIdx }, ''); }
    } else if(want < navIdx){
      const d = navIdx - want;
      navIdx = want;
      navIgnore = 1;
      history.go(-d);
      setTimeout(() => { if(navIgnore > 0){ navIgnore = 0; syncNav(); } }, 800);   // rete di sicurezza se il popstate non arriva
    }
  }catch(e){ navReady = false; }
}
// La voce "sentinella" si crea al primo tocco: i browser ignorano all'indietro le voci create senza interazione dell'utente.
function navArm(){
  if(navReady) return;
  try{
    history.replaceState({ padel:1, nav:0 }, '');
    history.pushState({ padel:1, nav:1 }, '');
    navIdx = 1;
    navReady = true;
    syncNav();
  }catch(e){ navReady = false; }
}
document.addEventListener('pointerdown', navArm, { passive:true });
window.addEventListener('popstate', function(e){
  if(!navReady) return;
  if(navIgnore > 0){
    navIgnore--;
    if(navIgnore === 0) syncNav();
    return;
  }
  const st = e.state;
  if(!st || st.padel !== 1 || typeof st.nav !== 'number') return;
  if(st.nav === navIdx) return;   // eco di un riallineamento già fatto: non è un "indietro" dell'utente
  navIdx = st.nav;
  navBusy = true;
  if(navIdx === 0){
    // Siamo sulla voce "sentinella": una web app non può chiudersi da sola, ma la pressione successiva di indietro
    // esce davvero. Quindi niente finestra di conferma: si avvisa, e se non succede nulla si torna sul torneo.
    navCloseAll();
    render();                      // con navBusy attivo syncNav resta in pausa
    navBusy = false;
    navExitArmed = true;
    showToast('Premi di nuovo indietro per uscire');
    clearTimeout(navExitTimer);
    navExitTimer = setTimeout(navExitDisarm, 2000);
    return;
  }
  const target = navIdx - 1;
  let guard = 12;
  while(navLayers().length > target && guard-- > 0) navCloseTop();
  navBusy = false;
  render();
});

// ---------- Versione e aggiornamenti ----------
const APP_VERSION = (document.querySelector('meta[name="app-version"]') || {}).content || '?';
let lastUpdateCheck = 0;
function showUpdateBar(v){
  const el = document.getElementById('updateBar');
  if(!el) return;
  el.innerHTML = '<span>Nuova versione disponibile ('+esc(v)+')</span><button class="small" onclick="location.reload()">Aggiorna</button>';
  el.style.display = 'flex';
}
async function checkForUpdate(force){
  if(location.protocol.indexOf('http') !== 0 || navigator.onLine === false) return;
  const now = Date.now();
  if(!force && now - lastUpdateCheck < 30 * 60 * 1000) return;
  lastUpdateCheck = now;
  try{
    const r = await fetch('./index.html', { cache:'no-store' });
    if(!r.ok) return;
    const m = (await r.text()).match(/name="app-version"\s+content="([^"]+)"/);
    if(m && m[1] !== APP_VERSION) showUpdateBar(m[1]);
  }catch(e){}
}
window.addEventListener('load', () => { setTimeout(() => checkForUpdate(true), 2500); });
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkForUpdate(false); });

// ---------- Memoria persistente ----------
let storagePersisted = null;
function requestPersistentStorage(){
  try{
    if(!(navigator.storage && navigator.storage.persisted)) return;
    navigator.storage.persisted().then(p => {
      if(p){ storagePersisted = true; return; }
      if(navigator.storage.persist) return navigator.storage.persist().then(ok => { storagePersisted = !!ok; });
    }).catch(() => {});
  }catch(e){}
}

initData();
document.getElementById('appver').textContent = 'Torneo Padel ' + APP_VERSION;
render();
requestPersistentStorage();
</script>
<script>
// PWA: funzionamento offline e app installabile (richiede HTTPS; non attivo aprendo il file in locale)
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(err){ console.log('Service worker non registrato:', err); });
  });
}
</script>
